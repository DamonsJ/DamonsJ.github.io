<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 724 244" width="724" height="244" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans SC&quot;,&quot;Hiragino Sans GB&quot;,&quot;Microsoft YaHei&quot;,sans-serif">
  <rect x="-12" y="-12" width="724" height="244" fill="#ffffff" /><title id="cr-t">ConvRot 分组旋转等价于块对角正交矩阵</title>
  <text x="20" y="22" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans SC&quot;,&quot;Hiragino Sans GB&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="13px" fill="#141b27" font-weight="700">激活 X（M × K）按 N<tspan dy="3" font-size="0.72em">0</tspan><tspan dy="-3">​</tspan> 分组</text>
  <g>
    <rect x="20" y="40" width="70" height="110" fill="#e7edfb" stroke="#2457c5" stroke-width="1.3" /><rect x="90" y="40" width="70" height="110" fill="#ffffff" stroke="#7b8597" stroke-width="1.2" /><rect x="160" y="40" width="70" height="110" fill="#e7edfb" stroke="#2457c5" stroke-width="1.3" /><rect x="230" y="40" width="70" height="110" fill="#ffffff" stroke="#7b8597" stroke-width="1.2" />
    <text x="55" y="100" text-anchor="middle" font-family="&quot;JetBrains Mono&quot;,&quot;SF Mono&quot;,Menlo,Consolas,monospace" font-size="11px" fill="#465163">X<tspan dy="3" font-size="0.72em">1</tspan><tspan dy="-3">​</tspan></text><text x="125" y="100" text-anchor="middle" font-family="&quot;JetBrains Mono&quot;,&quot;SF Mono&quot;,Menlo,Consolas,monospace" font-size="11px" fill="#465163">X<tspan dy="3" font-size="0.72em">2</tspan><tspan dy="-3">​</tspan></text><text x="195" y="100" text-anchor="middle" font-family="&quot;JetBrains Mono&quot;,&quot;SF Mono&quot;,Menlo,Consolas,monospace" font-size="11px" fill="#465163">X<tspan dy="3" font-size="0.72em">3</tspan><tspan dy="-3">​</tspan></text><text x="265" y="100" text-anchor="middle" font-family="&quot;JetBrains Mono&quot;,&quot;SF Mono&quot;,Menlo,Consolas,monospace" font-size="11px" fill="#465163">X<tspan dy="3" font-size="0.72em">4</tspan><tspan dy="-3">​</tspan></text>
    <text x="55" y="168" text-anchor="middle" font-family="&quot;JetBrains Mono&quot;,&quot;SF Mono&quot;,Menlo,Consolas,monospace" font-size="11px" fill="#7b8597">N<tspan dy="3" font-size="0.72em">0</tspan><tspan dy="-3">​</tspan></text>
  </g>
  <text x="318" y="100" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans SC&quot;,&quot;Hiragino Sans GB&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="13px" fill="#141b27" font-weight="700">×</text>
  <rect x="340" y="40" width="110" height="110" fill="#eaeef4" stroke="#d9dfe8" stroke-width="1" />
  <rect x="340" y="40" width="27.5" height="27.5" fill="#efe9fa" stroke="#6340b8" stroke-width="1.3" /><rect x="367.5" y="67.5" width="27.5" height="27.5" fill="#efe9fa" stroke="#6340b8" stroke-width="1.3" /><rect x="395" y="95" width="27.5" height="27.5" fill="#efe9fa" stroke="#6340b8" stroke-width="1.3" /><rect x="422.5" y="122.5" width="27.5" height="27.5" fill="#efe9fa" stroke="#6340b8" stroke-width="1.3" />
  <text x="395" y="168" text-anchor="middle" font-family="&quot;JetBrains Mono&quot;,&quot;SF Mono&quot;,Menlo,Consolas,monospace" font-size="11px" fill="#6340b8">diag(H, H, H, H)</text>
  <text x="395" y="186" text-anchor="middle" font-family="&quot;JetBrains Mono&quot;,&quot;SF Mono&quot;,Menlo,Consolas,monospace" font-size="11px" fill="#7b8597">K × K，但只存一个 N<tspan dy="3" font-size="0.72em">0</tspan><tspan dy="-3">​</tspan> × N<tspan dy="3" font-size="0.72em">0</tspan><tspan dy="-3">​</tspan></text>
  <text x="470" y="60" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans SC&quot;,&quot;Hiragino Sans GB&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="12px" fill="#141b27">实现：reshape 成</text>
  <text x="470" y="80" font-family="&quot;JetBrains Mono&quot;,&quot;SF Mono&quot;,Menlo,Consolas,monospace" font-size="11px" fill="#465163">[M·K/N<tspan dy="3" font-size="0.72em">0</tspan><tspan dy="-3">​</tspan>, N<tspan dy="3" font-size="0.72em">0</tspan><tspan dy="-3">​</tspan>] @ H</text>
  <text x="470" y="100" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans SC&quot;,&quot;Hiragino Sans GB&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="12px" fill="#141b27">一次普通矩阵乘，</text>
  <text x="470" y="120" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans SC&quot;,&quot;Hiragino Sans GB&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="12px" fill="#141b27">走 Tensor Core</text>
  <text x="470" y="150" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans SC&quot;,&quot;Hiragino Sans GB&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="12px" fill="#141b27">计算量 M·K·N<tspan dy="3" font-size="0.72em">0</tspan><tspan dy="-3">​</tspan>，</text>
  <text x="470" y="170" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans SC&quot;,&quot;Hiragino Sans GB&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="12px" fill="#141b27">对 K 是线性的</text>
  <text x="20" y="208" font-family="&quot;JetBrains Mono&quot;,&quot;SF Mono&quot;,Menlo,Consolas,monospace" font-size="11px" fill="#7b8597">论文把它描述为卷积核 [1, N<tspan dy="3" font-size="0.72em">0</tspan><tspan dy="-3">​</tspan>]、步长 (1, N<tspan dy="3" font-size="0.72em">0</tspan><tspan dy="-3">​</tspan>)、通道数 N<tspan dy="3" font-size="0.72em">0</tspan><tspan dy="-3">​</tspan> 的“卷积式”算子，ConvRot 的名字由此而来</text>
</svg>
