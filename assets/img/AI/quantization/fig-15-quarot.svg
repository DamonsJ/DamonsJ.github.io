  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8597" /></marker></defs><rect x="-12" y="-12" width="724" height="324" fill="#ffffff" /><title id="qr-t">QuaRot 在 Llama 解码层中的旋转位置</title>
  <rect x="10" y="134" width="680" height="30" rx="4" fill="#eaeef4" stroke="#d9dfe8" stroke-width="1" />
