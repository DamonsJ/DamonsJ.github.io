<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 724 274" width="724" height="274" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans SC&quot;,&quot;Hiragino Sans GB&quot;,&quot;Microsoft YaHei&quot;,sans-serif">
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8597" /></marker></defs><rect x="-12" y="-12" width="724" height="274" fill="#ffffff" /><title id="w4-t">W4A16 GEMM kernel 的数据流</title>
  <rect x="10" y="20" width="150" height="190" rx="6" fill="#eaeef4" stroke="#d9dfe8" stroke-width="1" />
  <text x="85" y="42" text-anchor="middle" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans SC&quot;,&quot;Hiragino Sans GB&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="13px" fill="#141b27" font-weight="700">HBM（显存）</text>
  <rect x="22" y="56" width="126" height="40" rx="4" fill="#e7edfb" stroke="#2457c5" stroke-width="1.3" /><text x="85" y="73" text-anchor="middle" font-family="&quot;JetBrains Mono&quot;,&quot;SF Mono&quot;,Menlo,Consolas,monospace" font-size="11px" fill="#465163">packed INT4</text><text x="85" y="88" text-anchor="middle" font-family="&quot;JetBrains Mono&quot;,&quot;SF Mono&quot;,Menlo,Consolas,monospace" font-size="11px" fill="#7b8597">K·N/8 个 int32</text>
  <rect x="22" y="104" width="126" height="40" rx="4" fill="#ffffff" stroke="#7b8597" stroke-width="1.2" /><text x="85" y="121" text-anchor="middle" font-family="&quot;JetBrains Mono&quot;,&quot;SF Mono&quot;,Menlo,Consolas,monospace" font-size="11px" fill="#465163">scale / zero</text><text x="85" y="136" text-anchor="middle" font-family="&quot;JetBrains Mono&quot;,&quot;SF Mono&quot;,Menlo,Consolas,monospace" font-size="11px" fill="#7b8597">每 g 个一组</text>
  <rect x="22" y="152" width="126" height="40" rx="4" fill="#ffffff" stroke="#7b8597" stroke-width="1.2" /><text x="85" y="169" text-anchor="middle" font-family="&quot;JetBrains Mono&quot;,&quot;SF Mono&quot;,Menlo,Consolas,monospace" font-size="11px" fill="#465163">激活 X</text><text x="85" y="184" text-anchor="middle" font-family="&quot;JetBrains Mono&quot;,&quot;SF Mono&quot;,Menlo,Consolas,monospace" font-size="11px" fill="#7b8597">FP16</text>
  <path d="M160,115 L196,115" marker-end="url(#arr)" stroke="#2457c5" stroke-width="2" fill="none" />
  <text x="180" y="106" text-anchor="middle" font-family="&quot;JetBrains Mono&quot;,&quot;SF Mono&quot;,Menlo,Consolas,monospace" font-size="8.5px" fill="#2457c5">cp.async</text>
  <rect x="200" y="56" width="110" height="118" rx="6" fill="#eaeef4" stroke="#d9dfe8" stroke-width="1" />
  <text x="255" y="78" text-anchor="middle" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans SC&quot;,&quot;Hiragino Sans GB&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="13px" fill="#141b27" font-weight="700">共享内存</text>
  <text x="255" y="102" text-anchor="middle" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans SC&quot;,&quot;Hiragino Sans GB&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="12px" fill="#141b27">权重 tile</text>
  <text x="255" y="122" text-anchor="middle" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans SC&quot;,&quot;Hiragino Sans GB&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="12px" fill="#141b27">scale tile</text>
  <text x="255" y="142" text-anchor="middle" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans SC&quot;,&quot;Hiragino Sans GB&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="12px" fill="#141b27">X tile</text>
  <text x="255" y="162" text-anchor="middle" font-family="&quot;JetBrains Mono&quot;,&quot;SF Mono&quot;,Menlo,Consolas,monospace" font-size="11px" fill="#7b8597">多级流水</text>
  <path d="M310,115 L346,115" marker-end="url(#arr)" stroke="#465163" stroke-width="1.3" fill="none" />
  <rect x="350" y="20" width="190" height="190" rx="6" fill="#efe9fa" stroke="#6340b8" stroke-width="1.3" />
  <text x="445" y="42" text-anchor="middle" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans SC&quot;,&quot;Hiragino Sans GB&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="13px" fill="#141b27" font-weight="700">寄存器</text>
  <text x="362" y="72" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans SC&quot;,&quot;Hiragino Sans GB&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="12px" fill="#141b27">① 解包：(w ≫ 4i) &amp; 0xF</text>
  <text x="362" y="98" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans SC&quot;,&quot;Hiragino Sans GB&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="12px" fill="#141b27">② 转 FP16：0x6400 | q</text>
  <text x="362" y="124" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans SC&quot;,&quot;Hiragino Sans GB&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="12px" fill="#141b27">③ 反量化：(h − 1024 − z)·s</text>
  <text x="362" y="150" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans SC&quot;,&quot;Hiragino Sans GB&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="12px" fill="#141b27">④ 得到 FP16 权重片段</text>
  <text x="362" y="186" font-family="&quot;JetBrains Mono&quot;,&quot;SF Mono&quot;,Menlo,Consolas,monospace" font-size="11px" fill="#6340b8">全程不写回显存</text>
  <path d="M540,115 L566,115" marker-end="url(#arr)" stroke="#465163" stroke-width="1.3" fill="none" />
  <rect x="570" y="56" width="120" height="118" rx="6" fill="#e7edfb" stroke="#2457c5" stroke-width="1.3" />
  <text x="630" y="80" text-anchor="middle" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans SC&quot;,&quot;Hiragino Sans GB&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="13px" fill="#141b27" font-weight="700">Tensor Core</text>
  <text x="630" y="106" text-anchor="middle" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans SC&quot;,&quot;Hiragino Sans GB&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="12px" fill="#141b27">FP16 × FP16</text>
  <text x="630" y="126" text-anchor="middle" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans SC&quot;,&quot;Hiragino Sans GB&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="12px" fill="#141b27">→ FP32 累加</text>
  <text x="630" y="156" text-anchor="middle" font-family="&quot;JetBrains Mono&quot;,&quot;SF Mono&quot;,Menlo,Consolas,monospace" font-size="11px" fill="#465163">Y (FP16)</text>
  <text x="350" y="240" text-anchor="middle" font-family="&quot;JetBrains Mono&quot;,&quot;SF Mono&quot;,Menlo,Consolas,monospace" font-size="11px" fill="#7b8597">带宽只花在 1/4 大小的权重上；反量化指令藏在访存延迟里</text>
</svg>
