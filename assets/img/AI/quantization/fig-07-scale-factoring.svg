  <text x="58" y="124" font-family="&quot;JetBrains Mono&quot;,&quot;SF Mono&quot;,Menlo,Consolas,monospace" font-size="11px" fill="#2457c5">第 i 行</text>
  <text x="216" y="130" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans SC&quot;,&quot;Hiragino Sans GB&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="13px" fill="#141b27" font-weight="700">×</text>
  <rect x="235" y="50" width="110" height="14" fill="#e2f3e9" stroke="#12784a" stroke-width="1.3" />
  <text x="290" y="42" text-anchor="middle" font-family="&quot;JetBrains Mono&quot;,&quot;SF Mono&quot;,Menlo,Consolas,monospace" font-size="11px" fill="#12784a">s_w</text>
  <rect x="235" y="70" width="110" height="110" fill="#ffffff" stroke="#7b8597" stroke-width="1.2" />
  <rect x="290" y="70" width="16" height="110" fill="#e2f3e9" stroke="#12784a" stroke-width="1.3" />
