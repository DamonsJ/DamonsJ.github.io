  <rect x="435" y="112" width="16" height="16" fill="#efe9fa" stroke="#6340b8" stroke-width="1.3" />
  <text x="435" y="196" text-anchor="middle" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans SC&quot;,&quot;Hiragino Sans GB&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="12px" fill="#141b27">Y（T×N）</text>
  <text x="510" y="96" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans SC&quot;,&quot;Hiragino Sans GB&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="12px" fill="#141b27">Y_ij = s_x[i] · s_w[j] ·</text>
  <text x="510" y="116" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans SC&quot;,&quot;Hiragino Sans GB&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="12px" fill="#141b27">Σ_k X_q[i,k] · W_q[j,k]</text>
