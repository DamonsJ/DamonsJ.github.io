  <rect x="-12" y="-12" width="714" height="354" fill="#ffffff" /><title id="fac-t">per-token 与 per-output-channel 的 scale 可以提到求和号外，per-input-channel 的不行</title>
  <rect x="30" y="70" width="14" height="110" fill="#e7edfb" stroke="#2457c5" stroke-width="1.3" />
