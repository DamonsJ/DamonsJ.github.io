  <text x="230" y="258" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans SC&quot;,&quot;Hiragino Sans GB&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="12px" fill="#141b27">Y_ij = s_w[j] · Σ_k s_k · X_q[i,k] · W_q[j,k]</text>
  <text x="230" y="280" font-family="&quot;JetBrains Mono&quot;,&quot;SF Mono&quot;,Menlo,Consolas,monospace" font-size="11px" fill="#bf5a0c">✗ s_k 随 k 变化，困在求和号里，整数 GEMM 用不了</text>
  <text x="230" y="302" font-family="&quot;JetBrains Mono&quot;,&quot;SF Mono&quot;,Menlo,Consolas,monospace" font-size="11px" fill="#2457c5">出路：离线把 s_k 乘进 W 的第 k 列（第 8 章 SmoothQuant）</text>
