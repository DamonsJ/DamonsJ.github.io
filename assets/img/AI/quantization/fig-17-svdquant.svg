<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 724 234" width="724" height="234" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans SC&quot;,&quot;Hiragino Sans GB&quot;,&quot;Microsoft YaHei&quot;,sans-serif">
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8597" /></marker></defs><rect x="-12" y="-12" width="724" height="234" fill="#ffffff" /><title id="svd-t">SVDQuant 的双支路结构与 Nunchaku 的 kernel 融合</title>
  <rect x="10" y="80" width="90" height="44" rx="5" fill="#ffffff" stroke="#7b8597" stroke-width="1.2" /><text x="55" y="106" text-anchor="middle" font-family="&quot;JetBrains Mono&quot;,&quot;SF Mono&quot;,Menlo,Consolas,monospace" font-size="11px" fill="#465163">X̂ (16 bit)</text>
  <rect x="140" y="20" width="200" height="56" rx="5" fill="#e2f3e9" stroke="#12784a" stroke-width="1.3" />
