  <rect x="140" y="128" width="200" height="56" rx="5" fill="#efe9fa" stroke="#6340b8" stroke-width="1.3" />
  <text x="240" y="150" text-anchor="middle" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans SC&quot;,&quot;Hiragino Sans GB&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="13px" fill="#141b27" font-weight="700">量化 Q(X̂) → INT4</text><text x="240" y="170" text-anchor="middle" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans SC&quot;,&quot;Hiragino Sans GB&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="12px" fill="#141b27">共享一次输入读取</text>
  <rect x="380" y="20" width="200" height="56" rx="5" fill="#e2f3e9" stroke="#12784a" stroke-width="1.3" />
  <text x="480" y="42" text-anchor="middle" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans SC&quot;,&quot;Hiragino Sans GB&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="13px" fill="#141b27" font-weight="700">低秩上投影 ·L<tspan dy="3" font-size="0.72em">2</tspan><tspan dy="-3">​</tspan></text><text x="480" y="62" text-anchor="middle" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans SC&quot;,&quot;Hiragino Sans GB&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="12px" fill="#141b27">（与 4 bit GEMM 融合）</text>
  <rect x="380" y="128" width="200" height="56" rx="5" fill="#e7edfb" stroke="#2457c5" stroke-width="1.3" />
  <text x="480" y="150" text-anchor="middle" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans SC&quot;,&quot;Hiragino Sans GB&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="13px" fill="#141b27" font-weight="700">W4A4 GEMM：Q(X̂)·Q(R)</text><text x="480" y="170" text-anchor="middle" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans SC&quot;,&quot;Hiragino Sans GB&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="12px" fill="#141b27">共享一次输出写回</text>
  <circle cx="620" cy="102" r="14" fill="#ffffff" stroke="#7b8597" stroke-width="1.2" /><text x="620" y="106" text-anchor="middle" font-family="&quot;JetBrains Mono&quot;,&quot;SF Mono&quot;,Menlo,Consolas,monospace" font-size="11px" fill="#465163">+</text>
