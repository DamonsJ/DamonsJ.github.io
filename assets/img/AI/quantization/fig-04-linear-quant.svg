  <path d="M488,72 L525,72" stroke="#2457c5" stroke-width="2" fill="none" /><text x="530" y="76" font-family="&quot;JetBrains Mono&quot;,&quot;SF Mono&quot;,Menlo,Consolas,monospace" font-size="11px" fill="#2457c5">s = 0.3</text>
  <text x="40" y="190" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans SC&quot;,&quot;Hiragino Sans GB&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="12px" fill="#141b27">x = 1.1：x/s = 3.67 → round = 4 → q = 4 + 5 = 9 → x̂ = 0.3 × (9 − 5) = 1.2，误差 0.1</text>
  <text x="40" y="208" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans SC&quot;,&quot;Hiragino Sans GB&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="12px" fill="#141b27">x = 3.4 &gt; 3.0：round(3.4/0.3) + 5 = 16 → clamp 到 15 → x̂ = 3.0（截断误差 0.4）</text>
