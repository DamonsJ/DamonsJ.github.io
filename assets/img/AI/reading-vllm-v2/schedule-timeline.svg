<text x="376" y="96" dominant-baseline="central" text-anchor="start" font-size="15" fill="#86440E" font-weight="bold">第 100 步 · 纯 decode</text>
<text x="376" y="118" dominant-baseline="central" text-anchor="start" font-size="13" fill="#334155" font-weight="normal">32 个请求各 1 token = 32 token</text>
