<text x="70" y="96" dominant-baseline="central" text-anchor="start" font-size="15" fill="#86440E" font-weight="bold">第 3 步 · 混合 batch</text>
<text x="70" y="118" dominant-baseline="central" text-anchor="start" font-size="13" fill="#334155" font-weight="normal">2 路 decode + 2 段 prefill = 8,192 token</text>
