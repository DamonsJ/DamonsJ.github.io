<text x="24" y="30" dominant-baseline="central" text-anchor="start" font-size="26" fill="#2F4E9E" font-weight="bold">64 路视频请求的调度全景（两代 Runner 收到的调度完全相同）</text>
<text x="25" y="60" dominant-baseline="central" text-anchor="start" font-size="15" fill="#475569" font-weight="normal">prompt 7,000 token · 输出 200 token · 每步预算 8,192 token · 最多 32 个活跃请求</text>
