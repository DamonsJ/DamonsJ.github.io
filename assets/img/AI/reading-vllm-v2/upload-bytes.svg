<text x="283.0" y="307" dominant-baseline="central" text-anchor="start" font-size="13" fill="#475569" font-weight="normal">平均每步约 2 个请求跨过块边界</text>
<line x1="24" y1="346" x2="936" y2="346" stroke="#E2E8F0"/>
<text x="24" y="382" dominant-baseline="central" text-anchor="start" font-size="16" fill="#2F4E9E" font-weight="bold">C · 第 201 步</text>
<text x="24" y="404" dominant-baseline="central" text-anchor="start" font-size="13" fill="#475569" font-weight="normal">32 请求，7,031 token</text>
<text x="198" y="381" dominant-baseline="central" text-anchor="end" font-size="14" fill="#1E4A78" font-weight="bold">MRV1</text>
<rect x="210.00" y="366" width="302.47" height="30" fill="#4A90E2"/>
