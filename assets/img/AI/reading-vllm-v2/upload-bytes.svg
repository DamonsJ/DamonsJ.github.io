<text x="198" y="425" dominant-baseline="central" text-anchor="end" font-size="14" fill="#275E3A" font-weight="bold">MRV2</text>
<rect x="210.00" y="410" width="2.05" height="30" fill="#4A90E2"/>
<rect x="212.05" y="410" width="1.50" height="30" fill="#A7B0BE"/>
<text x="223.55384615384617" y="425" dominant-baseline="central" text-anchor="start" font-size="15" fill="#334155" font-weight="bold">2.1 KB</text>
<text x="283.55384615384617" y="425" dominant-baseline="central" text-anchor="start" font-size="13" fill="#475569" font-weight="normal">R33 的 438 个块 ID</text>
<rect x="24" y="462" width="912" height="52" rx="8" fill="#F4F6F9" stroke="#A7B0BE" stroke-width="1.4"/>
<text x="40" y="478" dominant-baseline="central" text-anchor="start" font-size="14"><tspan fill="#334155" font-weight="bold">整个 64 路任务（428 步）合计：</tspan><tspan fill="#1E4A78" font-weight="bold">MRV1 ≈ 116 MB</tspan><tspan fill="#334155" font-weight="normal">，</tspan><tspan fill="#275E3A" font-weight="bold">MRV2 ≈ 0.27 MB</tspan></text>
<text x="40" y="498" dominant-baseline="central" text-anchor="start" font-size="13" fill="#475569" font-weight="normal">另有约 6.8 MB 的 prompt token 和 M-RoPE 位置，由 GPU kernel 经 UVA 直接从主机内存读取，CPU 不参与</text>
