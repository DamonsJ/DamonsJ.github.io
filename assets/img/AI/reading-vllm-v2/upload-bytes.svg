<text x="599.5923076923078" y="145" dominant-baseline="central" text-anchor="start" font-size="15" fill="#334155" font-weight="bold">320 KB</text>
<text x="198" y="189" dominant-baseline="central" text-anchor="end" font-size="14" fill="#275E3A" font-weight="bold">MRV2</text>
<rect x="210.00" y="174" width="2.40" height="30" fill="#4A90E2"/>
