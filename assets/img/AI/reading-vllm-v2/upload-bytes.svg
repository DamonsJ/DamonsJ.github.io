<text x="283.8953846153846" y="189" dominant-baseline="central" text-anchor="start" font-size="13" fill="#475569" font-weight="normal">块表只传新增 513 个块 ID</text>
<line x1="24" y1="228" x2="936" y2="228" stroke="#E2E8F0"/>
<text x="24" y="264" dominant-baseline="central" text-anchor="start" font-size="16" fill="#2F4E9E" font-weight="bold">B · 第 100 步</text>
<text x="24" y="286" dominant-baseline="central" text-anchor="start" font-size="13" fill="#475569" font-weight="normal">32 请求，32 token</text>
<text x="198" y="263" dominant-baseline="central" text-anchor="end" font-size="14" fill="#1E4A78" font-weight="bold">MRV1</text>
<rect x="210.00" y="248" width="302.47" height="30" fill="#4A90E2"/>
