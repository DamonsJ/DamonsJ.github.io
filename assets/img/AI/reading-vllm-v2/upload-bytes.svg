<text x="528.4738461538461" y="263" dominant-baseline="central" text-anchor="start" font-size="15" fill="#334155" font-weight="bold">257 KB</text>
<text x="198" y="307" dominant-baseline="central" text-anchor="end" font-size="14" fill="#275E3A" font-weight="bold">MRV2</text>
