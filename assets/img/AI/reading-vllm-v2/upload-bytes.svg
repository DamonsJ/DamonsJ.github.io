<svg xmlns="http://www.w3.org/2000/svg" width="960" height="526" viewBox="0 0 960 526" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif"><title>每步 CPU 准备并上传的输入数据</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#9AA3B2"/></marker><marker id="arrowO" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#F28C38"/></marker><marker id="arrowG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#57B26A"/></marker><marker id="arrowB" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#4A90E2"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#F4F6F9"/><line x1="0" y1="0" x2="0" y2="8" stroke="#CBD5E1" stroke-width="3"/></pattern></defs><rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="24" y="30" dominant-baseline="central" text-anchor="start" font-size="26" fill="#2F4E9E" font-weight="bold">每步要 CPU 算好、再拷给 GPU 的输入数据</text>
<text x="25" y="60" dominant-baseline="central" text-anchor="start" font-size="15" fill="#475569" font-weight="normal">max_model_len = 32,768，block_size = 16（块表一行 2,048 项 = 8 KB）；不含两代都要做的一次性 prompt 写入</text>
<rect x="24" y="84" width="14" height="14" rx="3" fill="#4A90E2"/>
<text x="44" y="91" dominant-baseline="central" text-anchor="start" font-size="13" fill="#334155" font-weight="normal">块表</text>
<rect x="84.0" y="84" width="14" height="14" rx="3" fill="#9A5AD6"/>
<text x="104.0" y="91" dominant-baseline="central" text-anchor="start" font-size="13" fill="#334155" font-weight="normal">M-RoPE positions</text>
<rect x="233.96000000000004" y="84" width="14" height="14" rx="3" fill="#F28C38"/>
<text x="253.96000000000004" y="91" dominant-baseline="central" text-anchor="start" font-size="13" fill="#334155" font-weight="normal">slot_mapping</text>
<rect x="351.68000000000006" y="84" width="14" height="14" rx="3" fill="#57B26A"/>
<text x="371.68000000000006" y="91" dominant-baseline="central" text-anchor="start" font-size="13" fill="#334155" font-weight="normal">input_ids</text>
<rect x="446.00000000000006" y="84" width="14" height="14" rx="3" fill="#A7B0BE"/>
<text x="466.00000000000006" y="91" dominant-baseline="central" text-anchor="start" font-size="13" fill="#334155" font-weight="normal">其他（qsl、seq_lens、idx_mapping…）</text>
<text x="24" y="146" dominant-baseline="central" text-anchor="start" font-size="16" fill="#2F4E9E" font-weight="bold">A · 第 3 步</text>
<text x="24" y="168" dominant-baseline="central" text-anchor="start" font-size="13" fill="#475569" font-weight="normal">4 请求，8,192 token</text>
<text x="198" y="145" dominant-baseline="central" text-anchor="end" font-size="14" fill="#1E4A78" font-weight="bold">MRV1</text>
