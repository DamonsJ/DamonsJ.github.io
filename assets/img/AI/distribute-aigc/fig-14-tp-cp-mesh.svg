<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="700" viewBox="0 0 1340 700"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs><rect width="1340" height="700" fill="#FFFFFF"/><text x="40" y="46" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:25px;fill:#1E3A8A;font-weight:700">TP x CP：4 张卡上两条正交的通信轴</text><text x="40" y="72" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13px;fill:#6B7280">TP=2 x CP=2 · rank = cp x TP + tp · 24 heads → 每 rank 12（TP）→ Attention 时 6（CP）</text><text x="40" y="108" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:14.5px;fill:#334155;font-weight:700">TP=2 x CP=2 = 4 张卡。每张卡的身份是一对坐标 (cp, tp)。</text><text x="370" y="146" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13.5px;fill:#4A90E2;font-weight:700">tp = 0</text><text x="670" y="146" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13.5px;fill:#4A90E2;font-weight:700">tp = 1</text><text x="200" y="222" text-anchor="end" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13.5px;fill:#57B26A;font-weight:700">cp = 0</text><text x="200" y="362" text-anchor="end" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13.5px;fill:#57B26A;font-weight:700">cp = 1</text><rect x="220" y="160" width="300" height="120" rx="8" fill="#F8FAFC" fill-opacity="1.0" stroke="#64748B" stroke-width="1.6"/><text x="232" y="181" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13.5px;fill:#64748B;font-weight:700">rank 0</text><text x="232" y="201" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">tokens 0…13639</text><text x="232" y="218" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">heads 0…11 的权重</text><rect x="540" y="160" width="300" height="120" rx="8" fill="#F8FAFC" fill-opacity="1.0" stroke="#64748B" stroke-width="1.6"/><text x="552" y="181" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13.5px;fill:#64748B;font-weight:700">rank 1</text><text x="552" y="201" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">tokens 0…13639</text><text x="552" y="218" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">heads 12…23 的权重</text><rect x="220" y="300" width="300" height="120" rx="8" fill="#F8FAFC" fill-opacity="1.0" stroke="#64748B" stroke-width="1.6"/><text x="232" y="321" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13.5px;fill:#64748B;font-weight:700">rank 2</text><text x="232" y="341" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">tokens 13640…27279</text><text x="232" y="358" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">heads 0…11 的权重</text><rect x="540" y="300" width="300" height="120" rx="8" fill="#F8FAFC" fill-opacity="1.0" stroke="#64748B" stroke-width="1.6"/><text x="552" y="321" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13.5px;fill:#64748B;font-weight:700">rank 3</text><text x="552" y="341" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">tokens 13640…27279</text><text x="552" y="358" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">heads 12…23 的权重</text><line x1="520" y1="220.0" x2="540" y2="220.0" stroke="#4A90E2" stroke-width="3" stroke-linecap="round"/><text x="530" y="210.0" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:11.5px;fill:#4A90E2;font-weight:700;paint-order:stroke" stroke="#ffffff" stroke-width="3.5">TP</text><line x1="520" y1="360.0" x2="540" y2="360.0" stroke="#4A90E2" stroke-width="3" stroke-linecap="round"/><text x="530" y="350.0" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:11.5px;fill:#4A90E2;font-weight:700;paint-order:stroke" stroke="#ffffff" stroke-width="3.5">TP</text><line x1="370.0" y1="280" x2="370.0" y2="300" stroke="#57B26A" stroke-width="3" stroke-linecap="round"/><text x="392.0" y="294" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:11.5px;fill:#57B26A;font-weight:700;paint-order:stroke" stroke="#ffffff" stroke-width="3.5">CP</text><line x1="690.0" y1="280" x2="690.0" y2="300" stroke="#57B26A" stroke-width="3" stroke-linecap="round"/><text x="712.0" y="294" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:11.5px;fill:#57B26A;font-weight:700;paint-order:stroke" stroke="#ffffff" stroke-width="3.5">CP</text><rect x="870" y="160" width="430" height="72" rx="8" fill="#EAF4FF" fill-opacity="1.0" stroke="#4A90E2" stroke-width="1.6"/><text x="882" y="181" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13.5px;fill:#4A90E2;font-weight:700">TP groups（固定 cp）</text><text x="882" y="201" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">[0, 1] 和 [2, 3]</text><text x="882" y="218" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">Row Linear 的 partial 在这里 All-Reduce SUM</text><rect x="870" y="260" width="430" height="72" rx="8" fill="#EAF8ED" fill-opacity="1.0" stroke="#57B26A" stroke-width="1.6"/><text x="882" y="281" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13.5px;fill:#57B26A;font-weight:700">CP groups（固定 tp）</text><text x="882" y="301" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">[0, 2] 和 [1, 3]</text><text x="882" y="318" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">Self-Attention 前后在这里 All-to-All</text><rect x="870" y="360" width="430" height="70" rx="8" fill="#FFE9EC" fill-opacity="1.0" stroke="#E11D48" stroke-width="1.4"/><text x="882" y="384" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#E11D48;font-weight:700">可整除约束（很容易在这里挂掉）</text><text x="882" y="402" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">local_heads = 24 / TP = 12；再要被 CP 整除：12 / 2 = 6。</text><text x="882" y="420" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">必须同时满足 24 % TP == 0 且 (24 / TP) % CP == 0。</text><rect x="40" y="440" width="800" height="220" rx="12" fill="#F8FAFC" fill-opacity="0.55" stroke="#64748B" stroke-width="2"/><text x="54" y="466" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:16px;fill:#64748B;font-weight:700">两条轴为什么不会互相干扰</text><text x="70" y="488" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#334155">TP 通信沿「谁持有哪段 hidden 通道」这条轴，把 partial sum 合成完整 residual；</text><text x="70" y="512" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#334155">CP 通信沿「谁持有哪段 token」这条轴，把 token ownership 换成 head ownership。</text><text x="70" y="548" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#334155;font-weight:700">两个 group 在 rank 网格上正交（一横一竖），所以可以嵌套而不冲突：</text><text x="70" y="584" text-anchor="start" style="font-family:'SF Mono',Menlo,Consolas,'Courier New',monospace;font-size:14px;fill:#1E3A8A;font-weight:700">CP A2A → Attention → CP A2A → TP Row GEMM → TP All-Reduce</text><text x="70" y="620" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#6B7280">顺序不能反：A2A 换的是 head 归属，必须发生在 Attention 两侧；All-Reduce 合的是通道 partial，必须发生在 Row Linear 之后。</text><rect x="870" y="440" width="430" height="88" rx="8" fill="#FEF6E7" fill-opacity="1.0" stroke="#D97706" stroke-width="1.4"/><text x="882" y="464" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#D97706;font-weight:700">读网格的口诀</text><text x="882" y="482" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">rank 0 与 rank 1：token 相同，head 权重不同。</text><text x="882" y="500" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">rank 0 与 rank 2：head 权重相同，token 不同。</text><text x="882" y="518" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">同一个 tp 坐标的 TP shard，在不同 cp 坐标上是复制的。</text></svg>