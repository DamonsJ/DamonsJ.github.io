<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="720" viewBox="0 0 1380 720"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs><rect width="1380" height="720" fill="#FFFFFF"/><text x="40" y="46" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:25px;fill:#1E3A8A;font-weight:700">CFG x TP x CP：实时视频生成里真正跑起来的 8 卡拓扑</text><text x="40" y="72" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13px;fill:#6B7280">CFG=2 x TP=2 x CP=2 · 每个 denoise step 结尾多一次 CFG group All-Gather</text><text x="40" y="108" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:14.5px;fill:#334155;font-weight:700">AIGC 特有的第 5 条轴：CFG 需要同时算 conditional 与 unconditional 两条分支</text><rect x="40" y="140" width="620" height="250" rx="12" fill="#FFF2E3" fill-opacity="0.55" stroke="#F28C38" stroke-width="2"/><text x="54" y="166" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:16px;fill:#F28C38;font-weight:700">CFG plane 0  ·  conditional</text><text x="70" y="186" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13px;fill:#334155;font-weight:700">ctx_cond（正向 prompt）</text><rect x="70" y="200" width="270" height="76" rx="8" fill="#F8FAFC" fill-opacity="1.0" stroke="#64748B" stroke-width="1.6"/><text x="82" y="221" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13.5px;fill:#64748B;font-weight:700">r0  (cfg0, cp0, tp0)</text><text x="82" y="241" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">前半 token · heads 0…11</text><rect x="360" y="200" width="270" height="76" rx="8" fill="#F8FAFC" fill-opacity="1.0" stroke="#64748B" stroke-width="1.6"/><text x="372" y="221" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13.5px;fill:#64748B;font-weight:700">r1  (cfg0, cp0, tp1)</text><text x="372" y="241" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">前半 token · heads 12…23</text><rect x="70" y="288" width="270" height="76" rx="8" fill="#F8FAFC" fill-opacity="1.0" stroke="#64748B" stroke-width="1.6"/><text x="82" y="309" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13.5px;fill:#64748B;font-weight:700">r2  (cfg0, cp1, tp0)</text><text x="82" y="329" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">后半 token · heads 0…11</text><rect x="360" y="288" width="270" height="76" rx="8" fill="#F8FAFC" fill-opacity="1.0" stroke="#64748B" stroke-width="1.6"/><text x="372" y="309" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13.5px;fill:#64748B;font-weight:700">r3  (cfg0, cp1, tp1)</text><text x="372" y="329" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">后半 token · heads 12…23</text><rect x="70" y="380" width="560" height="68" rx="8" fill="#FFF2E3" fill-opacity="1.0" stroke="#F28C38" stroke-width="1.6"/><text x="82" y="401" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13.5px;fill:#F28C38;font-weight:700">本 plane 的输出：pred_cond</text><text x="82" y="421" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">[1, 48, 31, 44, 80]</text><rect x="700" y="140" width="620" height="250" rx="12" fill="#FFF2E3" fill-opacity="0.55" stroke="#F28C38" stroke-width="2"/><text x="714" y="166" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:16px;fill:#F28C38;font-weight:700">CFG plane 1  ·  unconditional</text><text x="730" y="186" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13px;fill:#334155;font-weight:700">ctx_uncond（负向/空 prompt）</text><rect x="730" y="200" width="270" height="76" rx="8" fill="#F8FAFC" fill-opacity="1.0" stroke="#64748B" stroke-width="1.6"/><text x="742" y="221" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13.5px;fill:#64748B;font-weight:700">r4  (cfg1, cp0, tp0)</text><text x="742" y="241" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">前半 token · heads 0…11</text><rect x="1020" y="200" width="270" height="76" rx="8" fill="#F8FAFC" fill-opacity="1.0" stroke="#64748B" stroke-width="1.6"/><text x="1032" y="221" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13.5px;fill:#64748B;font-weight:700">r5  (cfg1, cp0, tp1)</text><text x="1032" y="241" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">前半 token · heads 12…23</text><rect x="730" y="288" width="270" height="76" rx="8" fill="#F8FAFC" fill-opacity="1.0" stroke="#64748B" stroke-width="1.6"/><text x="742" y="309" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13.5px;fill:#64748B;font-weight:700">r6  (cfg1, cp1, tp0)</text><text x="742" y="329" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">后半 token · heads 0…11</text><rect x="1020" y="288" width="270" height="76" rx="8" fill="#F8FAFC" fill-opacity="1.0" stroke="#64748B" stroke-width="1.6"/><text x="1032" y="309" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13.5px;fill:#64748B;font-weight:700">r7  (cfg1, cp1, tp1)</text><text x="1032" y="329" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">后半 token · heads 12…23</text><rect x="730" y="380" width="560" height="68" rx="8" fill="#FFF2E3" fill-opacity="1.0" stroke="#F28C38" stroke-width="1.6"/><text x="742" y="401" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13.5px;fill:#F28C38;font-weight:700">本 plane 的输出：pred_uncond</text><text x="742" y="421" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">[1, 48, 31, 44, 80]</text><rect x="480" y="470" width="420" height="74" rx="10" fill="#FFE9EC" fill-opacity="1.0" stroke="#E11D48" stroke-width="2"/><text x="690" y="500" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:15px;fill:#E11D48;font-weight:700">CFG group All-Gather</text><text x="690" y="524" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">[0,4] [1,5] [2,6] [3,7] 各自交换两条分支的预测</text><line x1="340" y1="452" x2="560" y2="468" stroke="#E11D48" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah)"/><line x1="1040" y1="452" x2="820" y2="468" stroke="#E11D48" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah)"/><line x1="690" y1="548" x2="690" y2="578" stroke="#E11D48" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah)"/><rect x="430" y="582" width="520" height="62" rx="10" fill="#FFFFFF" fill-opacity="1.0" stroke="#0F766E" stroke-width="2"/><text x="690" y="610" text-anchor="middle" style="font-family:'SF Mono',Menlo,Consolas,'Courier New',monospace;font-size:15px;fill:#0F766E;font-weight:700">guided = uncond + 5.0 x (cond − uncond)</text><text x="690" y="632" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:11.5px;fill:#6B7280">每 rank 本地 combine → UniPC scheduler step → 下一个 timestep</text><rect x="40" y="470" width="420" height="88" rx="8" fill="#FFE9EC" fill-opacity="1.0" stroke="#E11D48" stroke-width="1.4"/><text x="52" y="494" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#E11D48;font-weight:700">CFG 并行 ≠ DP</text><text x="52" y="512" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">DP：两个 plane 输入不同的样本，推理时永不通信。</text><text x="52" y="530" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">CFG：两个 plane 输入同一个 latent、不同的 context，</text><text x="52" y="548" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">每个 denoise step 都必须交换一次 branch prediction。</text><rect x="970" y="470" width="380" height="106" rx="8" fill="#F8FAFC" fill-opacity="1.0" stroke="#64748B" stroke-width="1.4"/><text x="982" y="494" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#64748B;font-weight:700">8 卡的 rank 公式</text><text x="982" y="512" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">rank = ((cfg x CP + cp) x TP + tp)</text><text x="982" y="530" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">tp = rank % TP</text><text x="982" y="548" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">cp = (rank // TP) % CP</text><text x="982" y="566" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">cfg = rank // (TP x CP)</text></svg>