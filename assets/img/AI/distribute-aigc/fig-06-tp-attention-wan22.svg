040" y1="523" x2="1040" y2="533" stroke="#94A3B8" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ah)"/><line x1="360" y1="615" x2="660" y2="650" stroke="#E11D48" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah)"/><line x1="1040" y1="615" x2="740" y2="650" stroke="#E11D48" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah)"/><rect x="480" y="650" width="440" height="62" rx="10" fill="#FFE9EC" fill-opacity="1.0" stroke="#E11D48" stroke-width="2"/><text x="700" y="678" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:15px;fill:#E11D48;font-weight:700">All-Reduce SUM   Y = Y₀_partial + Y₁_partial</text><text x="700" y="700" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#6B7280">两个 rank 再次拿到逐比特相同的完整 residual [1, 27280, 3072]</text><rect x="40" y="640" width="420" height="70" rx="8" fill="#FEF6E7" fill-opacity="1.0" stroke="#D97706" stroke-width="1.4"/><text x="52" y="664" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#D97706;font-weight:700">注意 TP 省的是什么</text><text x="52" y="682" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">TP 不改变 token 数：每个 rank 仍算 27280 x 27280 的 attention 分数，</text><text x="52" y="700" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">只是 head 数从 24 降到 12 —— 省的是显存和 GEMM 宽度，不是序列长度。</text><rect x="940" y="640" width="420" height="70" rx="8" fill="#F8FAFC" fill-opacity="1.0" stroke="#64748B" stroke-width="1.4"/><text x="952" y="664" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#64748B;font-weight:700">Cross-Attention 也一样</text><text x="952" y="682" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">Cross-Attention 完全同构：video Q 是 Column，text K/V 是 Column，</text><text x="952" y="700" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">输出 O 是 Row —— 于是每个 block 里 Attention 部分就有 2 次 All-Reduce。</text></svg>