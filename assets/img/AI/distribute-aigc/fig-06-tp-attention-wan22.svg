<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs><rect width="1400" height="780" fill="#FFFFFF"/><text x="40" y="46" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:25px;fill:#1E3A8A;font-weight:700">TP 应用到 Wan2.2 Self-Attention：从切权重到还原 residual</text><text x="40" y="72" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13px;fill:#6B7280">TP=2 · N=27280 · D=3072 · 24 heads x 128 · Column → Attention → Row → All-Reduce</text><rect x="40" y="100" width="1320" height="70" rx="12" fill="#F8FAFC" fill-opacity="0.55" stroke="#64748B" stroke-width="2"/><text x="54" y="126" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:16px;fill:#64748B;font-weight:700"></text><text x="64" y="130" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:15px;fill:#334155;font-weight:700">输入 X = [1, 27280, 3072]</text><text x="64" y="154" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#6B7280">TP 不切 token：两个 rank 都持有完整的 27280 个 video token，也都持有完整的 3072 维 residual。</text><line x1="700" y1="172" x2="380" y2="200" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah)"/><line x1="700" y1="172" x2="1020" y2="200" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round" marker-en