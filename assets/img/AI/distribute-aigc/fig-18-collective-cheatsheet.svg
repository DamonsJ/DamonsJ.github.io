<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="720" viewBox="0 0 1360 720"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs><rect width="1360" height="720" fill="#FFFFFF"/><text x="40" y="46" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:25px;fill:#1E3A8A;font-weight:700">通信算子速查：看到 shape 就知道该用哪个</text><text x="40" y="72" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13px;fill:#6B7280">逻辑张量大小 ≠ 实际链路流量，后者取决于 collective 算法与拓扑</text><rect x="40" y="140" width="420" height="128" rx="8" fill="#EAF4FF" fill-opacity="1.0" stroke="#4A90E2" stroke-width="1.6"/><text x="52" y="161" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13.5px;fill:#4A90E2;font-weight:700">All-Reduce (SUM)</text><text x="52" y="181" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">输入：每 rank 同 shape 的 partial</text><text x="52" y="198" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">输出：每 rank 都拿到逐元素总和</text><text x="52" y="215" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">Wan2.2：TP Row Linear 之后</text><rect x="480" y="140" width="420" height="128" rx="8" fill="#FFF2E3" fill-opacity="1.0" stroke="#F28C38" stroke-width="1.6"/><text x="492" y="161" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13.5px;fill:#F28C38;font-weight:700">All-Gather</text><text x="492" y="181" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">输入：每 rank 一块不同的 shard</text><text x="492" y="198" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">输出：每 rank 拼出完整张量</text><text x="492" y="215" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">Wan2.2：CP 末尾 gather token；CFG 换分支</text><rect x="920" y="140" width="420" height="128" rx="8" fill="#EAF8ED" fill-opacity="1.0" stroke="#57B26A" stroke-width="1.6"/><text x="932" y="161" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13.5px;fill:#57B26A;font-weight:700">All-to-All</text><text x="932" y="181" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">每 rank 把本地张量分成 p 份互换</text><text x="932" y="198" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">输出仍是 shard，只是 ownership 维度变了</text><text x="932" y="215" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">Wan2.2：CP 的 [N/p, H] ⇄ [N, H/p]</text><rect x="40" y="290" width="420" height="128" rx="8" fill="#F6EAFB" fill-opacity="1.0" stroke="#9A5AD6" stroke-width="1.6"/><text x="52" y="311" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13.5px;fill:#9A5AD6;font-weight:700">Reduce-Scatter</text><text x="52" y="331" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">先 SUM，再把结果切给各 rank</text><text x="52" y="348" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">训练梯度 / Megatron-SP 常用</text><text x="52" y="365" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">Wan2.2 TP 保持完整 residual，故用 All-Reduce</text><rect x="480" y="290" width="420" height="128" rx="8" fill="#F8FAFC" fill-opacity="1.0" stroke="#64748B" stroke-width="1.6"/><text x="492" y="311" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13.5px;fill:#64748B;font-weight:700">Send / Recv (P2P)</text><text x="492" y="331" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">点对点，不是 collective</text><text x="492" y="348" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">Wan2.2：PP stage 边界传激活</text><rect x="920" y="290" width="420" height="128" rx="8" fill="#F8FAFC" fill-opacity="1.0" stroke="#64748B" stroke-width="1.6"/><text x="932" y="311" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13.5px;fill:#64748B;font-weight:700">Broadcast</text><text x="932" y="331" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">root 的数据复制到所有 rank</text><text x="932" y="348" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">Wan2.2：保证各 rank 起始 latent 逐比特一致</text><rect x="40" y="450" width="640" height="230" rx="12" fill="#F8FAFC" fill-opacity="0.55" stroke="#64748B" stroke-width="2"/><text x="54" y="476" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:16px;fill:#64748B;font-weight:700">选算子的判断法</text><text x="70" y="500" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13px;fill:#334155">要「每人都拿到相同的完整和」</text><line x1="430" y1="495" x2="460" y2="495" stroke="#94A3B8" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ah)"/><text x="470" y="500" text-anchor="start" style="font-family:'SF Mono',Menlo,Consolas,'Courier New',monospace;font-size:13.5px;fill:#1E3A8A;font-weight:700">All-Reduce</text><text x="70" y="542" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13px;fill:#334155">要「拼接 shard 并复制成完整」</text><line x1="430" y1="537" x2="460" y2="537" stroke="#94A3B8" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ah)"/><text x="470" y="542" text-anchor="start" style="font-family:'SF Mono',Menlo,Consolas,'Courier New',monospace;font-size:13.5px;fill:#1E3A8A;font-weight:700">All-Gather</text><text x="70" y="584" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13px;fill:#334155">要「从按 token 切改成按 head 切」</text><line x1="430" y1="579" x2="460" y2="579" stroke="#94A3B8" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ah)"/><text x="470" y="584" text-anchor="start" style="font-family:'SF Mono',Menlo,Consolas,'Courier New',monospace;font-size:13.5px;fill:#1E3A8A;font-weight:700">All-to-All</text><text x="70" y="626" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13px;fill:#334155">要「求和之后仍然保持 shard」</text><line x1="430" y1="621" x2="460" y2="621" stroke="#94A3B8" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ah)"/><text x="470" y="626" text-anchor="start" style="font-family:'SF Mono',Menlo,Consolas,'Courier New',monospace;font-size:13.5px;fill:#1E3A8A;font-weight:700">Reduce-Scatter</text><rect x="710" y="450" width="610" height="230" rx="12" fill="#FFE9EC" fill-opacity="0.55" stroke="#E11D48" stroke-width="2"/><text x="724" y="476" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:16px;fill:#E11D48;font-weight:700">Wan2.2 上的真实字节数（BF16, B=1）</text><line x1="735" y1="474" x2="1305" y2="474" stroke="#F1D5DA" stroke-width="1" stroke-linecap="round"/><text x="740" y="496" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">TP Row All-Reduce，CP=1</text><text x="1030" y="496" text-anchor="start" style="font-family:'SF Mono',Menlo,Consolas,'Courier New',monospace;font-size:11.5px;fill:#6B7280">[1,27280,3072]</text><text x="1300" y="496" text-anchor="end" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#E11D48;font-weight:700">159.84 MiB</text><line x1="735" y1="510" x2="1305" y2="510" stroke="#F1D5DA" stroke-width="1" stroke-linecap="round"/><text x="740" y="532" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">TP Row All-Reduce，CP=2</text><text x="1030" y="532" text-anchor="start" style="font-family:'SF Mono',Menlo,Consolas,'Courier New',monospace;font-size:11.5px;fill:#6B7280">[1,13640,3072]</text><text x="1300" y="532" text-anchor="end" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#E11D48;font-weight:700">79.92 MiB</text><line x1="735" y1="546" x2="1305" y2="546" stroke="#F1D5DA" stroke-width="1" stroke-linecap="round"/><text x="740" y="568" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">CP=2 fused QKV A2A</text><text x="1030" y="568" text-anchor="start" style="font-family:'SF Mono',Menlo,Consolas,'Courier New',monospace;font-size:11.5px;fill:#6B7280">3 x [1,13640,24,128]</text><text x="1300" y="568" text-anchor="end" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#E11D48;font-weight:700">239.77 MiB</text><line x1="735" y1="582" x2="1305" y2="582" stroke="#F1D5DA" stroke-width="1" stroke-linecap="round"/><text x="740" y="604" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">CP=2 output A2A</text><text x="1030" y="604" text-anchor="start" style="font-family:'SF Mono',Menlo,Consolas,'Courier New',monospace;font-size:11.5px;fill:#6B7280">[1,27280,12,128]</text><text x="1300" y="604" text-anchor="end" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#E11D48;font-weight:700">79.92 MiB</text><line x1="735" y1="618" x2="1305" y2="618" stroke="#F1D5DA" stroke-width="1" stroke-linecap="round"/><text x="740" y="640" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">CP final gather（192 维）</text><text x="1030" y="640" text-anchor="start" style="font-family:'SF Mono',Menlo,Consolas,'Courier New',monospace;font-size:11.5px;fill:#6B7280">[1,13640,192]</text><text x="1300" y="640" text-anchor="end" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#E11D48;font-weight:700">5.00 MiB</text></svg>