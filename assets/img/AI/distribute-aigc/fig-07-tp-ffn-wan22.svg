oke-width="1.4" stroke-linecap="round" marker-end="url(#ah)"/><rect x="979" y="448" width="285" height="89" rx="8" fill="#FFF2E3" fill-opacity="1.0" stroke="#F28C38" stroke-width="1.6"/><text x="991" y="469" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13.5px;fill:#F28C38;font-weight:700">④ 常驻状态</text><text x="991" y="489" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">每个 tp rank 只存自己的 shard</text><text x="991" y="506" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">50 个 denoise step 全程不再切</text><text x="991" y="523" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">CP / DP rank 复制同一 shard</text><line x1="961" y1="500" x2="975" y2="500" stroke="#94A3B8" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ah)"/><text x="70" y="620" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#334155">显存收益：TP=2 时 FFN 权重从 2 x 14336 x 3072 x 2B ≈ 176 MB / 层降到一半；30 层合计省下约 2.6 GB。</text></svg>