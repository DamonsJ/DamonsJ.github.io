128]</text><text x="1140" y="203" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:11.5px;fill:#334155">→ [1, 13640, 12, 128]</text><rect x="40" y="305" width="252" height="118" rx="8" fill="#EAF4FF" fill-opacity="1.0" stroke="#4A90E2" stroke-width="1.6"/><text x="52" y="326" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#4A90E2;font-weight:700">6 · reshape</text><text x="52" y="346" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:11.5px;fill:#334155">A_local = [1, 13640, 1536]</text><text x="52" y="363" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:11.5px;fill:#334155">仍是 TP hidden shard</text><line x1="294" y1="364" x2="308" y2="364" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="312" y="305" width="252" height="118" rx="8" fill="#EAF4FF" fill-opacity="1.0" stroke="#4A90E2" stroke-width="1.6"/><text x="324" y="326" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#4A90E2;font-weight:700">7 · TP Row Wo</text><text x="324" y="346" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:11.5px;fill:#334155">Wo_local = [3072, 1536]</text><text x="324" y="363" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:11.5px;fill:#334155">P_local = [1, 13640, 3072]</text><text x="324" y="380" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:11.5px;fill:#334155">partial</text><line x1="566" y1="364" x2="580" y2="364" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="584" y="305" width="252" height="118" rx="8" fill="#FFE9EC" fill-opacity="1.0" stroke="#E11D48" stroke-width="1.6"/><text x="596" y="326" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#E11D48;font-weight:700">8 · TP All-Reduce SUM</text><text x="596" y="346" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:11.5px;fill:#334155">在 group [0,1] 内</text><text x="596" y="363" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:11.5px;fill:#334155">得到完整 hidden residual</text><line x1="838" y1="364" x2="852" y2="364" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="856" y="305" width="252" height="118" rx="8" fill="#EAF8ED" fill-opacity="1.0" stroke="#57B26A" stroke-width="1.6"/><text x="868" y="326" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#57B26A;font-weight:700">9 · 本地 residual</text><text x="868" y="346" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:11.5px;fill:#334155">Y_local = [1, 13640, 3072]</text><text x="868" y="363" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:11.5px;fill:#334155">仍按 CP token shard</text><path d="M 1160 263 L 1290 263 L 1290 300 L 40 300 L 40 305 L 40 305" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 4" marker-end="url(#ah)"/><text x="660" y="292" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:11.5px;fill:#6B7280;paint-order:stroke" stroke="#ffffff" stroke-width="3.5">换行</text><rect x="40" y="470" width="1320" height="170" rx="12" fill="#F8FAFC" fill-opacity="0.55" stroke="#64748B" stroke-width="2"/><text x="54" y="496" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:16px;fill:#64748B;font-weight:700">FFN 部分：CP 不新增任何 collective</text><text x="70" y="518" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13px;fill:#334155">ffn_0 TP Column [3072→7168] → 本地 GELU → ffn_2 TP Row [7168→3072] → 同一个 TP group 再 All-Reduce 一次。</text><text x="70" y="546" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13px;fill:#57B26A;font-weight:700">CP 在 FFN 里唯一的作用，是把 N 从 27280 变成 13640 —— 计算量和 All-Reduce 的字节数同时减半。</text><text x="70" y="586" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13px;fill:#334155;font-weight:700">一句话总结：CP 通信改变 token/head 的归属；TP 通信把 hidden-channel 的 partial sum 合成完整 residual。</text><text x="70" y="614" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#6B7280">两者的 process group 正交，所以可以安全地嵌在同一层里。</text></svg>