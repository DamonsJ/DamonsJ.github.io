<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="700" viewBox="0 0 1360 700"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs><rect width="1360" height="700" fill="#FFFFFF"/><text x="40" y="46" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:25px;fill:#1E3A8A;font-weight:700">Ulysses CP 完整数据流：一次 Self-Attention 里的两次 All-to-All</text><text x="40" y="72" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13px;fill:#6B7280">CP=2 · TP=1 · N=27280 → 13640 · 24 heads → 12 heads</text><rect x="40" y="140" width="245" height="89" rx="8" fill="#EAF8ED" fill-opacity="1.0" stroke="#57B26A" stroke-width="1.6"/><text x="52" y="161" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13.5px;fill:#57B26A;font-weight:700">① 本地 Q/K/V 投影</text><text x="52" y="181" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">每 rank 只处理自己的 token</text><text x="52" y="198" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">Q,K,V = [1, 13640, 24, 128]</text><text x="52" y="215" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">权重是完整复制的（CP 不切权重）</text><rect x="303" y="140" width="245" height="89" rx="8" fill="#FFE9EC" fill-opacity="1.0" stroke="#E11D48" stroke-width="1.6"/><text x="315" y="161" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13.5px;fill:#E11D48;font-weight:700">② A2A(seq → head)</text><text x="315" y="181" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">发给 CP0：heads 0…11 那一半</text><text x="315" y="198" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">发给 CP1：heads 12…23 那一半</text><text x="315" y="215" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">每条消息带自己的 13640 个 token</text><line x1="285" y1="190" x2="299" y2="190" stroke="#94A3B8" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah)"/><rect x="566" y="140" width="245" height="89" rx="8" fill="#EAF4FF" fill-opacity="1.0" stroke="#4A90E2" stroke-width="1.6"/><text x="578" y="161" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13.5px;fill:#4A90E2;font-weight:700">③ 完整上下文 Attention</text><text x="578" y="181" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">Q,K,V = [1, 27280, 12, 128]</text><text x="578" y="198" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">FlashAttention / SDPA</text><text x="578" y="215" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">每个 head 都看到全部 27280 token</text><line x1="548" y1="190" x2="562" y2="190" stroke="#94A3B8" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah)"/><rect x="829" y="140" width="245" height="89" rx="8" fill="#FFE9EC" fill-opacity="1.0" stroke="#E11D48" stroke-width="1.6"/><text x="841" y="161" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13.5px;fill:#E11D48;font-weight:700">④ A2A(head → seq)</text><text x="841" y="181" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">[1, 27280, 12, 128]</text><text x="841" y="198" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">→ [1, 13640, 24, 128]</text><text x="841" y="215" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">恢复原来的 token ownership</text><line x1="811" y1="190" x2="825" y2="190" stroke="#94A3B8" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah)"/><rect x="1092" y="140" width="245" height="89" rx="8" fill="#EAF8ED" fill-opacity="1.0" stroke="#57B26A" stroke-width="1.6"/><text x="1104" y="161" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13.5px;fill:#57B26A;font-weight:700">⑤ 回到 block 的其余部分</text><text x="1104" y="181" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">reshape → [1, 13640, 3072]</text><text x="1104" y="198" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">Cross-Attn / FFN / residual</text><text x="1104" y="215" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">全部 token-local，无通信</text><line x1="1074" y1="190" x2="1088" y2="190" stroke="#94A3B8" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah)"/><text x="40" y="290" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13.5px;fill:#E11D48;font-weight:700">每个 Self-Attention 的通信总账：1 次 fused QKV All-to-All + 1 次 output All-to-All。</text><rect x="40" y="320" width="640" height="300" rx="12" fill="#FFF2E3" fill-opacity="0.55" stroke="#F28C38" stroke-width="2"/><text x="54" y="346" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:16px;fill:#F28C38;font-weight:700">⑥ 30 层跑完之后，才做唯一的那次 All-Gather</text><rect x="70" y="366" width="260" height="89" rx="8" fill="#F8FAFC" fill-opacity="1.0" stroke="#64748B" stroke-width="1.6"/><text x="82" y="387" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13.5px;fill:#64748B;font-weight:700">先过 output head</text><text x="82" y="407" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">[1, 13640, 3072]</text><text x="82" y="424" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">→ Linear 3072→192</text><text x="82" y="441" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">→ [1, 13640, 192]</text><line x1="340" y1="400" x2="400" y2="400" stroke="#F28C38" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah)"/><text x="370" y="386" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:11px;fill:#F28C38;font-weight:700;paint-order:stroke" stroke="#ffffff" stroke-width="3.5">gather</text><rect x="410" y="366" width="250" height="89" rx="8" fill="#FFF2E3" fill-opacity="1.0" stroke="#F28C38" stroke-width="1.6"/><text x="422" y="387" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13.5px;fill:#F28C38;font-weight:700">All-Gather 拼回完整序列</text><text x="422" y="407" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">[1, 27280, 192]</text><text x="422" y="424" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">→ unpatchify</text><text x="422" y="441" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">→ [1, 48, 31, 44, 80]</text><text x="70" y="510" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13.5px;fill:#334155;font-weight:700">为什么等到 output head 之后才 gather？</text><text x="70" y="536" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#334155">本地 shard 在 192 维时约 5.00 MiB；在 3072 维时约 79.92 MiB。</text><text x="70" y="560" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#0F766E;font-weight:700">先降维再 gather，通信量差 16 倍。</text><text x="70" y="592" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#6B7280;font-style:italic">这是一条通用经验：collective 尽量放在张量最窄的地方。</text><rect x="710" y="320" width="610" height="300" rx="12" fill="#EAF8ED" fill-opacity="0.55" stroke="#57B26A" stroke-width="2"/><text x="724" y="346" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:16px;fill:#57B26A;font-weight:700">CP 到底省了什么</text><line x1="735" y1="350" x2="1295" y2="350" stroke="#E2E8F0" stroke-width="1" stroke-linecap="round"/><text x="740" y="372" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#334155">Self-Attention 计算量</text><text x="1000" y="372" text-anchor="start" style="font-family:'SF Mono',Menlo,Consolas,'Courier New',monospace;font-size:12px;fill:#6B7280">O(N²) → O((N/CP)·N)</text><text x="1290" y="372" text-anchor="end" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#57B26A;font-weight:700">CP=2 时减半</text><line x1="735" y1="392" x2="1295" y2="392" stroke="#E2E8F0" stroke-width="1" stroke-linecap="round"/><text x="740" y="414" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#334155">block 内激活显存</text><text x="1000" y="414" text-anchor="start" style="font-family:'SF Mono',Menlo,Consolas,'Courier New',monospace;font-size:12px;fill:#6B7280">27280 → 13640 tokens</text><text x="1290" y="414" text-anchor="end" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#57B26A;font-weight:700">线性下降</text><line x1="735" y1="434" x2="1295" y2="434" stroke="#E2E8F0" stroke-width="1" stroke-linecap="round"/><text x="740" y="456" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#334155">模型权重</text><text x="1000" y="456" text-anchor="start" style="font-family:'SF Mono',Menlo,Consolas,'Courier New',monospace;font-size:12px;fill:#6B7280">完整复制</text><text x="1290" y="456" text-anchor="end" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#57B26A;font-weight:700">一分没省</text><line x1="735" y1="476" x2="1295" y2="476" stroke="#E2E8F0" stroke-width="1" stroke-linecap="round"/><text x="740" y="498" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#334155">新增通信</text><text x="1000" y="498" text-anchor="start" style="font-family:'SF Mono',Menlo,Consolas,'Courier New',monospace;font-size:12px;fill:#6B7280">每层 2 次 All-to-All</text><text x="1290" y="498" text-anchor="end" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#57B26A;font-weight:700">换来的代价</text><text x="740" y="592" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#334155">所以 CP 是「时延优化」而不是「显存装得下」的手段 —— 这正是实时生成需要它的原因。</text></svg>