<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="620" viewBox="0 0 1300 620"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs><rect width="1300" height="620" fill="#FFFFFF"/><text x="40" y="46" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:25px;fill:#1E3A8A;font-weight:700">DP：切样本，不切权重</text><text x="40" y="72" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13px;fill:#6B7280">两张卡、两个 704x1280x121 请求；每张卡都是一个完整的 Wan2.2</text><rect x="40" y="100" width="1220" height="60" rx="12" fill="#F8FAFC" fill-opacity="0.55" stroke="#64748B" stroke-width="2"/><text x="54" y="126" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:16px;fill:#64748B;font-weight:700"></text><text x="60" y="137" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:14px;fill:#334155;font-weight:700">逻辑 batch：请求 A（图 A → 视频 A）、请求 B（图 B → 视频 B）</text><text x="700" y="137" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13px;fill:#6B7280">DP=2：按请求把 batch 拆开，模型一分不切</text><rect x="40" y="190" width="600" height="300" rx="12" fill="#F6EAFB" fill-opacity="0.55" stroke="#9A5AD6" stroke-width="2"/><text x="54" y="216" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:16px;fill:#9A5AD6;font-weight:700">GPU 0  ·  DP rank 0</text><rect x="60" y="230" width="260" height="89" rx="8" fill="#F8FAFC" fill-opacity="1.0" stroke="#64748B" stroke-width="1.6"/><text x="72" y="251" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13.5px;fill:#64748B;font-weight:700">完整权重 W</text><text x="72" y="271" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">30 个 WanBlock 全在本卡</text><text x="72" y="288" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">5B 参数 · BF16 ≈ 10 GB</text><text x="72" y="305" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">与另一张卡逐比特相同</text><rect x="60" y="350" width="260" height="72" rx="8" fill="#EAF8ED" fill-opacity="1.0" stroke="#57B26A" stroke-width="1.6"/><text x="72" y="371" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13.5px;fill:#57B26A;font-weight:700">输入：样本 A</text><text x="72" y="391" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">X = [1, 27280, 3072]</text><text x="72" y="408" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">完整 sequence、完整 head</text><rect x="350" y="230" width="270" height="89" rx="8" fill="#EAF4FF" fill-opacity="1.0" stroke="#4A90E2" stroke-width="1.6"/>