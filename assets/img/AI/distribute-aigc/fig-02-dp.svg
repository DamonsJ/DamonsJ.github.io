xt-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">完整 sequence、完整 head</text><rect x="970" y="230" width="270" height="89" rx="8" fill="#EAF4FF" fill-opacity="1.0" stroke="#4A90E2" stroke-width="1.6"/><text x="982" y="251" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13.5px;fill:#4A90E2;font-weight:700">完整 forward</text><text x="982" y="271" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">Self-Attn → Cross-Attn → FFN</text><text x="982" y="288" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">x 30 层 x 50 steps</text><text x="982" y="305" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">过程中与另一卡零通信</text><rect x="970" y="350" width="270" height="72" rx="8" fill="#FFF2E3" fill-opacity="1.0" stroke="#F28C38" stroke-width="1.6"/><text x="982" y="371" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13.5px;fill:#F28C38;font-weight:700">预测 B</text><text x="982" y="391" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">[1, 48, 31, 44, 80]</text><text x="982" y="408" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">VAE decode 后即成片</text><line x1="940" y1="270" x2="970" y2="270" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah)"/><line x1="940" y1="385" x2="970" y2="385" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah)"/><line x1="320" y1="165" x2="200" y2="185" stroke="#9A5AD6" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah)"/><line x1="980" y1="165" x2="900" y2="185" stroke="#9A5AD6" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah)"/><rect x="40" y="520" width="590" height="70" rx="8" fill="#FFE9EC" fill-opacity="1.0" stroke="#E11D48" stroke-width="1.4"/><text x="52" y="544" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#E11D48;font-weight:700">DP 没有发生的事</text><text x="52" y="562" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">不切 head、不切 FFN 通道、不切 token、不切层。</text><text x="52" y="580" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">唯一被切的是「哪张卡负责哪个请求」。</text><rect x="660" y="520" width="600" height="70" rx="8" fill="#FEF6E7" fill-opacity="1.0" stroke="#D97706" stroke-width="1.4"/><text x="672" y="544" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#D97706;font-weight:700">通信只在训练时出现</text><text x="672" y="562" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">推理：DP rank 之间 0 通信，按 request id 返回结果即可。</text><text x="672" y="580" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">训练：backward 后 All-Reduce 梯度 dW=(dW_A+dW_B)/2，权重才不会漂移。</text></svg>