<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="730" viewBox="0 0 1340 730"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs><rect width="1340" height="730" fill="#FFFFFF"/><text x="40" y="46" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:25px;fill:#1E3A8A;font-weight:700">SP 与 CP：都切 token，但 Attention 期间谁拥有完整序列不同</text><text x="40" y="72" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13px;fill:#6B7280">关键区别在于 Attention 内部是否还保持着 sequence shard</text><rect x="40" y="100" width="600" height="530" rx="12" fill="#FFF2E3" fill-opacity="0.55" stroke="#F28C38" stroke-width="2"/><text x="54" y="126" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:16px;fill:#F28C38;font-weight:700">① Megatron 风格 SP（与 TP 紧耦合）</text><rect x="64" y="146" width="552" height="72" rx="8" fill="#EAF8ED" fill-opacity="1.0" stroke="#57B26A" stroke-width="1.6"/><text x="76" y="167" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#57B26A;font-weight:700">block 边界：sequence shard</text><text x="76" y="187" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:11.5px;fill:#334155">rank0: X[0:N/2, :]</text><text x="76" y="204" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:11.5px;fill:#334155">rank1: X[N/2:N, :]</text><rect x="64" y="230" width="552" height="72" rx="8" fill="#EAF8ED" fill-opacity="1.0" stroke="#57B26A" stroke-width="1.6"/><text x="76" y="251" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#57B26A;font-weight:700">token-local 算子</text><text x="76" y="271" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:11.5px;fill:#334155">LayerNorm / dropout / residual</text><text x="76" y="288" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:11.5px;fill:#334155">各 rank 只算 N/2 个 token</text><line x1="340" y1="218" x2="340" y2="228" stroke="#94A3B8" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ah)"/><rect x="64" y="314" width="552" height="72" rx="8" fill="#FFE9EC" fill-opacity="1.0" stroke="#E11D48" stroke-width="1.6"/><text x="76" y="335" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#E11D48;font-weight:700">进 TP Column 之前</text><text x="76" y="355" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:11.5px;fill:#334155">All-Gather(sequence)</text><text x="76" y="372" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:11.5px;fill:#334155">恢复完整 [N, D] 给每个 TP rank</text><line x1="340" y1="302" x2="340" y2="312" stroke="#94A3B8" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ah)"/><rect x="64" y="398" width="552" height="72" rx="8" fill="#EAF4FF" fill-opacity="1.0" stroke="#4A90E2" stroke-width="1.6"/><text x="76" y="419" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#4A90E2;font-weight:700">Attention</text><text x="76" y="439" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:11.5px;fill:#334155">每个 TP rank 对完整 N 做自己的 head shard</text><text x="76" y="456" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:11.5px;fill:#334155">Attention 内部不保留 sequence shard</text><line x1="340" y1="386" x2="340" y2="396" stroke="#94A3B8" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ah)"/><rect x="64" y="482" width="552" height="72" rx="8" fill="#FFE9EC" fill-opacity="1.0" stroke="#E11D48" stroke-width="1.6"/><text x="76" y="503" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#E11D48;font-weight:700">TP Row 之后</text><text x="76" y="523" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:11.5px;fill:#334155">Reduce-Scatter(sequence)</text><text x="76" y="540" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:11.5px;fill:#334155">SUM partial + 重新切回 N/2</text><line x1="340" y1="470" x2="340" y2="480" stroke="#94A3B8" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ah)"/><text x="64" y="582" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#6B7280">目的：省掉 TP 没覆盖到的那部分激活（LN / residual）。</text><text x="64" y="602" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#6B7280">它没有解决长序列 Attention 本身的 K/V 内存。</text><rect x="700" y="100" width="600" height="530" rx="12" fill="#EAF8ED" fill-opacity="0.55" stroke="#57B26A" stroke-width="2"/><text x="714" y="126" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:16px;fill:#57B26A;font-weight:700">② Ulysses CP（Wan2.2 实际用的）</text><rect x="724" y="146" width="552" height="72" rx="8" fill="#EAF8ED" fill-opacity="1.0" stroke="#57B26A" stroke-width="1.6"/><text x="736" y="167" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#57B26A;font-weight:700">block 边界：sequence shard</text><text x="736" y="187" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:11.5px;fill:#334155">rank0: X[0:N/2, :]</text><text x="736" y="204" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:11.5px;fill:#334155">rank1: X[N/2:N, :]</text><rect x="724" y="230" width="552" height="72" rx="8" fill="#EAF8ED" fill-opacity="1.0" stroke="#57B26A" stroke-width="1.6"/><text x="736" y="251" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#57B26A;font-weight:700">本地 Q/K/V 投影</text><text x="736" y="271" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:11.5px;fill:#334155">[B, N/2, H, Dh]</text><text x="736" y="288" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:11.5px;fill:#334155">仍然只处理本地 token</text><line x1="1000" y1="218" x2="1000" y2="228" stroke="#94A3B8" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ah)"/><rect x="724" y="314" width="552" height="72" rx="8" fill="#FFE9EC" fill-opacity="1.0" stroke="#E11D48" stroke-width="1.6"/><text x="736" y="335" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#E11D48;font-weight:700">All-to-All：seq → head</text><text x="736" y="355" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:11.5px;fill:#334155">[N/2, H] → [N, H/2]</text><text x="736" y="372" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:11.5px;fill:#334155">重分布，不复制完整 H</text><line x1="1000" y1="302" x2="1000" y2="312" stroke="#94A3B8" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ah)"/><rect x="724" y="398" width="552" height="72" rx="8" fill="#EAF4FF" fill-opacity="1.0" stroke="#4A90E2" stroke-width="1.6"/><text x="736" y="419" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#4A90E2;font-weight:700">Attention</text><text x="736" y="439" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:11.5px;fill:#334155">每 rank：完整 N + 一部分 head</text><text x="736" y="456" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:11.5px;fill:#334155">可以正确看到全序列</text><line x1="1000" y1="386" x2="1000" y2="396" stroke="#94A3B8" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ah)"/><rect x="724" y="482" width="552" height="72" rx="8" fill="#FFE9EC" fill-opacity="1.0" stroke="#E11D48" stroke-width="1.6"/><text x="736" y="503" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#E11D48;font-weight:700">All-to-All：head → seq</text><text x="736" y="523" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:11.5px;fill:#334155">[N, H/2] → [N/2, H]</text><text x="736" y="540" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:11.5px;fill:#334155">回到原来的 token ownership</text><line x1="1000" y1="470" x2="1000" y2="480" stroke="#94A3B8" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ah)"/><text x="724" y="582" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#6B7280">目的：整个 block 全程保持 sequence shard，</text><text x="724" y="602" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#6B7280">用 head shard 临时换取完整上下文。</text><rect x="40" y="650" width="1260" height="70" rx="8" fill="#FEF6E7" fill-opacity="1.0" stroke="#D97706" stroke-width="1.4"/><text x="52" y="674" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#D97706;font-weight:700">术语提醒：名字相近，边界完全不同</text><text x="52" y="692" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">有些框架把 Ulysses 也叫 sequence parallel。判断一份实现到底是哪种，不要看名字，看 Attention 前后：</text><text x="52" y="710" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">出现 All-Gather / Reduce-Scatter 的是 Megatron-SP；出现 sequence ↔ head All-to-All 的是 Ulysses CP。</text></svg>