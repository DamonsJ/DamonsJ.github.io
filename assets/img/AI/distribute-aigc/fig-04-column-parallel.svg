<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="700" viewBox="0 0 1340 700"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs><rect width="1340" height="700" fill="#FFFFFF"/><text x="40" y="46" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:25px;fill:#1E3A8A;font-weight:700">Column Parallel：按输出通道切权重（Wan2.2 Q/K/V、ffn_0）</text><text x="40" y="72" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13px;fill:#6B7280">切 W 的列 → 输出也按列切开 → 各 rank 各算各的，零通信</text><text x="40" y="108" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:14.5px;fill:#334155;font-weight:700">以 Wan2.2 Self-Attention 的 Q 投影为例：W_math = [3072, 3072]，TP=2</text><text x="60" y="140" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#6B7280">X（两 rank 完整复制）</text><rect x="60" y="150" width="120" height="190" rx="4" fill="#F1F5F9" fill-opacity="1.0" stroke="#64748B" stroke-width="1.6"/><text x="120" y="240" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:24px;fill:#475569;font-weight:700">X</text><text x="120" y="266" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:11.5px;fill:#6B7280">[1, 27280, 3072]</text><text x="120" y="358" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#6B7280">m = 27280   k = 3072</text><text x="200" y="245" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:24px;fill:#6B7280">·</text><text x="230" y="140" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#6B7280">Wq_math [3072, 3072] 沿 n 切成两半</text><rect x="230" y="150" width="130" height="190" rx="4" fill="#EAF4FF" fill-opacity="1.0" stroke="#4A90E2" stroke-width="1.2"/><text x="295.0" y="242.0" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:20px;fill:#4A90E2;font-weight:700">Wq₀</text><text x="295.0" y="258.0" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:18.5px;fill:#6B7280">n = 0…1535</text><rect x="360" y="150" width="130" height="190" rx="4" fill="#EAF8ED" fill-opacity="1.0" stroke="#57B26A" stroke-width="1.2"/><text x="425.0" y="242.0" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:20px;fill:#57B26A;font-weight:700">Wq₁</text><text x="425.0" y="258.0" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:18.5px;fill:#6B7280">n = 1536…3071</text><line x1="360" y1="144" x2="360" y2="346" stroke="#E11D48" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 4"/><text x="360" y="370" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#E11D48;font-weight:700">1536 = 12 heads x 128</text><text x="530" y="245" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:24px;fill:#6B7280">=</text><text x="560" y="140" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#6B7280">Q = X·Wq_math，按列天然分成两段</text><rect x="560" y="150" width="130" height="190" rx="4" fill="#EAF4FF" fill-opacity="1.0" stroke="#4A90E2" stroke-width="1.2"/><text x="625.0" y="242.0" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:20px;fill:#4A90E2;font-weight:700">Q₀</text><text x="625.0" y="258.0" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:18.5px;fill:#6B7280">rank 0 独有</text><rect x="690" y="150" width="130" height="190" rx="4" fill="#EAF8ED" fill-opacity="1.0" stroke="#57B26A" stroke-width="1.2"/><text x="755.0" y="242.0" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:20px;fill:#57B26A;font-weight:700">Q₁</text><text x="755.0" y="258.0" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:18.5px;fill:#6B7280">rank 1 独有</text><text x="690" y="370" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#6B7280">各 [1, 27280, 12, 128]</text><rect x="880" y="140" width="420" height="88" rx="8" fill="#EAF4FF" fill-opacity="1.0" stroke="#4A90E2" stroke-width="1.4"/><text x="892" y="164" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#4A90E2;font-weight:700">关键性质：Column 不通信</text><text x="892" y="182" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">rank 0 只持有 Wq₀，只算出 Q₀；rank 1 同理。</text><text x="892" y="200" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">没有任何 rank 需要另一半的结果就能算完自己那段。</text><text x="892" y="218" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">所以 Column Parallel 本身 不产生任何通信。</text><rect x="880" y="250" width="420" height="88" rx="8" fill="#FEF6E7" fill-opacity="1.0" stroke="#D97706" stroke-width="1.4"/><text x="892" y="274" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#D97706;font-weight:700">代码里长什么样</text><text x="892" y="292" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">PyTorch 存 weight[out, in] = [3072, 3072]（已转置）。</text><text x="892" y="310" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">数学上「切 n（列）」= 代码里 narrow(dim=0)。</text><text x="892" y="328" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">Wan2.2：Wq/Wk/Wv、ffn_0 都走这条路径。</text><rect x="40" y="400" width="800" height="240" rx="12" fill="#EAF4FF" fill-opacity="0.55" stroke="#4A90E2" stroke-width="2"/><text x="54" y="426" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:16px;fill:#4A90E2;font-weight:700">24 个 head 是怎么分到两张卡上的</text><rect x="70" y="450" width="30" height="46" rx="4" fill="#EAF4FF" fill-opacity="1.0" stroke="#4A90E2" stroke-width="1.2"/><text x="85.0" y="477.0" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:10.5px;fill:#4A90E2">h0</text><rect x="102" y="450" width="30" height="46" rx="4" fill="#EAF4FF" fill-opacity="1.0" stroke="#4A90E2" stroke-width="1.2"/><text x="117.0" y="477.0" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:10.5px;fill:#4A90E2">h1</text><rect x="134" y="450" width="30" height="46" rx="4" fill="#EAF4FF" fill-opacity="1.0" stroke="#4A90E2" stroke-width="1.2"/><text x="149.0" y="477.0" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:10.5px;fill:#4A90E2">h2</text><rect x="166" y="450" width="30" height="46" rx="4" fill="#EAF4FF" fill-opacity="1.0" stroke="#4A90E2" stroke-width="1.2"/><text x="181.0" y="477.0" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:10.5px;fill:#4A90E2">h3</text><rect x="198" y="450" width="30" height="46" rx="4" fill="#EAF4FF" fill-opacity="1.0" stroke="#4A90E2" stroke-width="1.2"/><text x="213.0" y="477.0" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:10.5px;fill:#4A90E2">h4</text><rect x="230" y="450" width="30" height="46" rx="4" fill="#EAF4FF" fill-opacity="1.0" stroke="#4A90E2" stroke-width="1.2"/><text x="245.0" y="477.0" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:10.5px;fill:#4A90E2">h5</text><rect x="262" y="450" width="30" height="46" rx="4" fill="#EAF4FF" fill-opacity="1.0" stroke="#4A90E2" stroke-width="1.2"/><text x="277.0" y="477.0" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:10.5px;fill:#4A90E2">h6</text><rect x="294" y="450" width="30" height="46" rx="4" fill="#EAF4FF" fill-opacity="1.0" stroke="#4A90E2" stroke-width="1.2"/><text x="309.0" y="477.0" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:10.5px;fill:#4A90E2">h7</text><rect x="326" y="450" width="30" height="46" rx="4" fill="#EAF4FF" fill-opacity="1.0" stroke="#4A90E2" stroke-width="1.2"/><text x="341.0" y="477.0" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:10.5px;fill:#4A90E2">h8</text><rect x="358" y="450" width="30" height="46" rx="4" fill="#EAF4FF" fill-opacity="1.0" stroke="#4A90E2" stroke-width="1.2"/><text x="373.0" y="477.0" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:10.5px;fill:#4A90E2">h9</text><rect x="390" y="450" width="30" height="46" rx="4" fill="#EAF4FF" fill-opacity="1.0" stroke="#4A90E2" stroke-width="1.2"/><text x="405.0" y="477.0" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:10.5px;fill:#4A90E2">h10</text><rect x="422" y="450" width="30" height="46" rx="4" fill="#EAF4FF" fill-opacity="1.0" stroke="#4A90E2" stroke-width="1.2"/><text x="437.0" y="477.0" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:10.5px;fill:#4A90E2">h11</text><rect x="454" y="450" width="30" height="46" rx="4" fill="#EAF8ED" fill-opacity="1.0" stroke="#57B26A" stroke-width="1.2"/><text x="469.0" y="477.0" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:10.5px;fill:#57B26A">h12</text><rect x="486" y="450" width="30" height="46" rx="4" fill="#EAF8ED" fill-opacity="1.0" stroke="#57B26A" stroke-width="1.2"/><text x="501.0" y="477.0" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:10.5px;fill:#57B26A">h13</text><rect x="518" y="450" width="30" height="46" rx="4" fill="#EAF8ED" fill-opacity="1.0" stroke="#57B26A" stroke-width="1.2"/><text x="533.0" y="477.0" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:10.5px;fill:#57B26A">h14</text><rect x="550" y="450" width="30" height="46" rx="4" fill="#EAF8ED" fill-opacity="1.0" stroke="#57B26A" stroke-width="1.2"/><text x="565.0" y="477.0" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:10.5px;fill:#57B26A">h15</text><rect x="582" y="450" width="30" height="46" rx="4" fill="#EAF8ED" fill-opacity="1.0" stroke="#57B26A" stroke-width="1.2"/><text x="597.0" y="477.0" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:10.5px;fill:#57B26A">h16</text><rect x="614" y="450" width="30" height="46" rx="4" fill="#EAF8ED" fill-opacity="1.0" stroke="#57B26A" stroke-width="1.2"/><text x="629.0" y="477.0" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:10.5px;fill:#57B26A">h17</text><rect x="646" y="450" width="30" height="46" rx="4" fill="#EAF8ED" fill-opacity="1.0" stroke="#57B26A" stroke-width="1.2"/><text x="661.0" y="477.0" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:10.5px;fill:#57B26A">h18</text><rect x="678" y="450" width="30" height="46" rx="4" fill="#EAF8ED" fill-opacity="1.0" stroke="#57B26A" stroke-width="1.2"/><text x="693.0" y="477.0" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:10.5px;fill:#57B26A">h19</text><rect x="710" y="450" width="30" height="46" rx="4" fill="#EAF8ED" fill-opacity="1.0" stroke="#57B26A" stroke-width="1.2"/><text x="725.0" y="477.0" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:10.5px;fill:#57B26A">h20</text><rect x="742" y="450" width="30" height="46" rx="4" fill="#EAF8ED" fill-opacity="1.0" stroke="#57B26A" stroke-width="1.2"/><text x="757.0" y="477.0" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:10.5px;fill:#57B26A">h21</text><rect x="774" y="450" width="30" height="46" rx="4" fill="#EAF8ED" fill-opacity="1.0" stroke="#57B26A" stroke-width="1.2"/><text x="789.0" y="477.0" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:10.5px;fill:#57B26A">h22</text><rect x="806" y="450" width="30" height="46" rx="4" fill="#EAF8ED" fill-opacity="1.0" stroke="#57B26A" stroke-width="1.2"/><text x="821.0" y="477.0" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:10.5px;fill:#57B26A">h23</text><line x1="453" y1="440" x2="453" y2="506" stroke="#E11D48" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 4"/><text x="262" y="528" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13px;fill:#4A90E2;font-weight:700">rank 0：heads 0…11 → 12x128 = 1536 hidden</text><text x="646" y="528" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13px;fill:#57B26A;font-weight:700">rank 1：heads 12…23 → 12x128 = 1536 hidden</text><text x="70" y="568" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#334155">head 是 Attention 的天然独立单元：head i 的 softmax 只用 head i 的 Q/K/V，所以按 head 切完全不损失数学等价性。</text><text x="70" y="592" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#E11D48;font-weight:700">约束：heads 必须能被 TP 整除。24 % TP == 0 → TP ∈ {1,2,3,4,6,8,12,24}。</text><rect x="870" y="400" width="430" height="106" rx="8" fill="#F8FAFC" fill-opacity="1.0" stroke="#64748B" stroke-width="1.4"/><text x="882" y="424" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#64748B;font-weight:700">Wan2.2 中所有 Column Parallel 权重（TP=2）</text><text x="882" y="442" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">Wq [3072,3072] → 2 x [1536,3072]</text><text x="882" y="460" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">Wk [3072,3072] → 2 x [1536,3072]</text><text x="882" y="478" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">Wv [3072,3072] → 2 x [1536,3072]</text><text x="882" y="496" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">ffn_0 [14336,3072] → 2 x [7168,3072]</text></svg>