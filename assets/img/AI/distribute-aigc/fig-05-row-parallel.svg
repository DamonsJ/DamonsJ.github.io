<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="700" viewBox="0 0 1340 700"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs><rect width="1340" height="700" fill="#FFFFFF"/><text x="40" y="46" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:25px;fill:#1E3A8A;font-weight:700">Row Parallel：按输入通道切权重（Wan2.2 Wo、ffn_2）</text><text x="40" y="72" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13px;fill:#6B7280">切 W 的行 → 每个 rank 得到一个形状完整但数值不完整的 partial → All-Reduce SUM 还原</text><text x="40" y="108" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:14.5px;fill:#334155;font-weight:700">以 Wan2.2 Self-Attention 的输出投影 Wo 为例：W_math = [3072, 3072]，TP=2</text><text x="60" y="140" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#6B7280">A = Attention 输出（已经是切开的）</text><rect x="60" y="150" width="90" height="190" rx="4" fill="#EAF4FF" fill-opacity="1.0" stroke="#4A90E2" stroke-width="1.2"/><text x="105.0" y="242.0" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:20px;fill:#4A90E2;font-weight:700">A₀</text><text x="105.0" y="258.0" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:18.5px;fill:#6B7280">rank 0</text><rect x="150" y="150" width="90" height="190" rx="4" fill="#EAF8ED" fill-opacity="1.0" stroke="#57B26A" stroke-width="1.2"/><text x="195.0" y="242.0" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:20px;fill:#57B26A;font-weight:700">A₁</text><text x="195.0" y="258.0" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:18.5px;fill:#6B7280">rank 1</text><text x="150" y="362" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#6B7280">各 [1, 27280, 1536]</text><text x="270" y="245" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:24px;fill:#6B7280">·</text><text x="250" y="140" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#6B7280">Wo_math [3072, 3072] 沿 k 切成上下两块</text><rect x="250" y="150" width="170" height="95" rx="4" fill="#EAF4FF" fill-opacity="1.0" stroke="#4A90E2" stroke-width="1.2"/><text x="335.0" y="194.5" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:20px;fill:#4A90E2;font-weight:700">Wo₀</text><text x="335.0" y="210.5" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:18.5px;fill:#6B7280">k = 0…1535</text><rect x="250" y="245" width="170" height="95" rx="4" fill="#EAF8ED" fill-opacity="1.0" stroke="#57B26A" stroke-width="1.2"/><text x="335.0" y="289.5" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:20px;fill:#57B26A;font-weight:700">Wo₁</text><text x="335.0" y="305.5" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:18.5px;fill:#6B7280">k = 1536…3071</text><line x1="244" y1="245" x2="426" y2="245" stroke="#E11D48" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 4"/><text x="490" y="245" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:24px;fill:#6B7280">=</text><text x="500" y="140" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#6B7280">两个 partial：形状完整，数值不完整</text><rect x="500" y="150" width="150" height="88" rx="4" fill="#EAF4FF" fill-opacity="1.0" stroke="#4A90E2" stroke-width="1.6" stroke-dasharray="5 4"/><text x="575" y="190" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:14px;fill:#4A90E2;font-weight:700">Y₀ = A₀·Wo₀</text><text x="575" y="212" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:11.5px;fill:#6B7280">[1, 27280, 3072]</text><rect x="500" y="252" width="150" height="88" rx="4" fill="#EAF8ED" fill-opacity="1.0" stroke="#57B26A" stroke-width="1.6" stroke-dasharray="5 4"/><text x="575" y="292" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:14px;fill:#57B26A;font-weight:700">Y₁ = A₁·Wo₁</text><text x="575" y="314" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:11.5px;fill:#6B7280">[1, 27280, 3072]</text><line x1="660" y1="194" x2="715" y2="238" stroke="#E11D48" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah)"/><line x1="660" y1="296" x2="715" y2="252" stroke="#E11D48" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah)"/><rect x="720" y="205" width="170" height="80" rx="8" fill="#FFE9EC" fill-opacity="1.0" stroke="#E11D48" stroke-width="2"/><text x="805" y="234" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:14px;fill:#E11D48;font-weight:700">All-Reduce SUM</text><text x="805" y="256" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:11.5px;fill:#6B7280">159.84 MiB / 次 (BF16)</text><line x1="895" y1="245" x2="950" y2="245" stroke="#E11D48" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah)"/><rect x="955" y="180" width="150" height="130" rx="4" fill="#FFFFFF" fill-opacity="1.0" stroke="#0F766E" stroke-width="2"/><text x="1030" y="238" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:24px;fill:#0F766E;font-weight:700">Y</text><text x="1030" y="262" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:11.5px;fill:#6B7280">两 rank 完全一致</text><text x="1030" y="330" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#6B7280">[1, 27280, 3072]</text><rect x="40" y="400" width="640" height="250" rx="12" fill="#FFE9EC" fill-opacity="0.55" stroke="#E11D48" stroke-width="2"/><text x="54" y="426" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:16px;fill:#E11D48;font-weight:700">为什么必须是 SUM，而不是拼接</text><text x="70" y="448" text-anchor="start" style="font-family:'SF Mono',Menlo,Consolas,'Courier New',monospace;font-size:15px;fill:#334155">Wo = [ Wo₀ ]        A = [ A₀ | A₁ ]</text><text x="70" y="474" text-anchor="start" style="font-family:'SF Mono',Menlo,Consolas,'Courier New',monospace;font-size:15px;fill:#334155">     [ Wo₁ ]</text><text x="70" y="500" text-anchor="start" style="font-family:'SF Mono',Menlo,Consolas,'Courier New',monospace;font-size:15px;fill:#334155"></text><text x="70" y="526" text-anchor="start" style="font-family:'SF Mono',Menlo,Consolas,'Courier New',monospace;font-size:15px;fill:#334155;font-weight:700">A · Wo  =  A₀·Wo₀  +  A₁·Wo₁</text><text x="70" y="578" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#334155">分块矩阵乘法的定义：沿 k 切开后，每个 rank 算的是完整 [m,n] 矩阵中</text><text x="70" y="600" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#334155">「一部分被加项的和」。少加一项，结果就是错的——所以必须逐元素求和。</text><rect x="710" y="400" width="590" height="88" rx="8" fill="#FEF6E7" fill-opacity="1.0" stroke="#D97706" stroke-width="1.4"/><text x="722" y="424" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#D97706;font-weight:700">最容易踩的坑：bias 加了 TP 次</text><text x="722" y="442" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">bias 若在每个 rank 的 partial 上先加，All-Reduce 之后会被重复加 TP 次。</text><text x="722" y="460" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">正确顺序：各 rank 算无 bias 的 partial → All-Reduce SUM → 只加一次 bias。</text><text x="722" y="478" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">Wan2.2 的 TPRowLinear 明确把 bias 放在 reduction 之后。</text><rect x="710" y="520" width="590" height="88" rx="8" fill="#F8FAFC" fill-opacity="1.0" stroke="#64748B" stroke-width="1.4"/><text x="722" y="544" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#64748B;font-weight:700">Wan2.2 中所有 Row Parallel 的位置</text><text x="722" y="562" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">self_attn.o、cross_attn.o、ffn_2 —— 每个 WanBlock 共 3 次 All-Reduce。</text><text x="722" y="580" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">30 层 x 3 次 x 50 steps = 4500 次 All-Reduce / 一条视频。</text><text x="722" y="598" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">这就是 TP 必须待在 NVLink 域内、很少跨机的原因。</text></svg>