<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="660" viewBox="0 0 1300 660"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs><rect width="1300" height="660" fill="#FFFFFF"/><text x="40" y="46" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:25px;fill:#1E3A8A;font-weight:700">TP 的两种基本切法：Column Parallel 与 Row Parallel</text><text x="40" y="72" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13px;fill:#6B7280">一个 Linear 只有两条可切的轴；选哪条，决定了要不要通信、通信什么</text><text x="40" y="108" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:15px;fill:#334155;font-weight:700">所有 TP 的切法，都归结为对一个 GEMM  Y = X · W  选一条轴</text><text x="40" y="130" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#6B7280">约定：数学形状 X[m,k] · W[k,n] = Y[m,n]；PyTorch nn.Linear 把 W 存成 weight[n,k]（转置存放）</text><rect x="40" y="156" width="600" height="300" rx="12" fill="#EAF4FF" fill-opacity="0.55" stroke="#4A90E2" stroke-width="2"/><text x="54" y="182" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:16px;fill:#4A90E2;font-weight:700">① Column Parallel：切 W 的输出维 n</text><rect x="70" y="210" width="90" height="130" rx="4" fill="#F1F5F9" fill-opacity="1.0" stroke="#64748B" stroke-width="1.6"/><text x="115" y="275" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:20px;fill:#475569;font-weight:700">X</text><text x="115" y="358" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#6B7280">[m, k]</text><text x="175" y="280" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:22px;fill:#6B7280">·</text><rect x="200" y="210" width="75" height="130" rx="4" fill="#EAF4FF" fill-opacity="1.0" stroke="#4A90E2" stroke-width="1.2"/><text x="237.5" y="279.0" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:18px;fill:#4A90E2;font-weight:700">W₀</text><rect x="275" y="210" width="75" height="130" rx="4" fill="#EAF8ED" fill-opacity="1.0" stroke="#57B26A" stroke-width="1.2"/><text x="312.5" y="279.0" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:18px;fill:#57B26A;font-weight:700">W₁</text><text x="275" y="358" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#6B7280">[k, n] 沿 n（列）切</text><text x="365" y="280" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:22px;fill:#6B7280">=</text><rect x="390" y="210" width="75" height="130" rx="4" fill="#EAF4FF" fill-opacity="1.0" stroke="#4A90E2" stroke-width="1.2"/><text x="427.5" y="279.0" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:18px;fill:#4A90E2;font-weight:700">Y₀</text><rect x="465" y="210" width="75" height="130" rx="4" fill="#EAF8ED" fill-opacity="1.0" stroke="#57B26A" stroke-width="1.2"/><text x="502.5" y="279.0" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:18px;fill:#57B26A;font-weight:700">Y₁</text><text x="465" y="358" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#6B7280">[m, n] 天然按列拼</text><text x="70" y="420" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#4A90E2;font-weight:700">rank i 只算 Y 的一段通道 → 直接拼接即完整，无需通信</text><rect x="660" y="156" width="600" height="300" rx="12" fill="#EAF8ED" fill-opacity="0.55" stroke="#57B26A" stroke-width="2"/><text x="674" y="182" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:16px;fill:#57B26A;font-weight:700">② Row Parallel：切 W 的输入维 k</text><rect x="690" y="210" width="90" height="130" rx="4" fill="#F1F5F9" fill-opacity="1.0" stroke="#64748B" stroke-width="1.6"/><text x="735" y="275" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:20px;fill:#475569;font-weight:700">X</text><text x="735" y="358" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#6B7280">[m, k]</text><text x="795" y="280" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:22px;fill:#6B7280">·</text><rect x="820" y="210" width="150" height="65" rx="4" fill="#EAF4FF" fill-opacity="1.0" stroke="#4A90E2" stroke-width="1.2"/><text x="895.0" y="246.5" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:18px;fill:#4A90E2;font-weight:700">W₀</text><rect x="820" y="275" width="150" height="65" rx="4" fill="#EAF8ED" fill-opacity="1.0" stroke="#57B26A" stroke-width="1.2"/><text x="895.0" y="311.5" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:18px;fill:#57B26A;font-weight:700">W₁</text><text x="895" y="358" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#6B7280">[k, n] 沿 k（行）切</text><text x="985" y="280" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:22px;fill:#6B7280">=</text><rect x="1010" y="210" width="150" height="130" rx="4" fill="#FFFFFF" fill-opacity="1.0" stroke="#E11D48" stroke-width="2" stroke-dasharray="6 4"/><text x="1085" y="270" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:17px;fill:#E11D48;font-weight:700">Y₀ + Y₁</text><text x="1085" y="294" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#6B7280">两个 partial</text><text x="1085" y="358" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#6B7280">[m, n] 必须逐元素相加</text><text x="690" y="420" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#E11D48;font-weight:700">rank i 算的是完整形状但只含一部分被加项 → 必须 All-Reduce SUM</text><rect x="40" y="476" width="1220" height="154" rx="12" fill="#F8FAFC" fill-opacity="0.55" stroke="#64748B" stroke-width="2"/><text x="54" y="502" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:16px;fill:#64748B;font-weight:700">③ 为什么两者必须成对出现</text><text x="70" y="528" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13.5px;fill:#334155">Column 的输出是「按通道切开的」，正好就是 Row 的输入所需要的形状。</text><text x="70" y="552" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13.5px;fill:#334155">于是 Column → (逐元素算子) → Row 这一段里，中间激活始终是切开的，只在 Row 之后做一次 All-Reduce。</text><text x="70" y="588" text-anchor="start" style="font-family:'SF Mono',Menlo,Consolas,'Courier New',monospace;font-size:14px;fill:#4A90E2;font-weight:700">Q/K/V (Column) → Attention → Wo (Row) → All-Reduce</text><text x="70" y="612" text-anchor="start" style="font-family:'SF Mono',Menlo,Consolas,'Courier New',monospace;font-size:14px;fill:#4A90E2;font-weight:700">ffn_0 (Column) → GELU → ffn_2 (Row) → All-Reduce</text></svg>