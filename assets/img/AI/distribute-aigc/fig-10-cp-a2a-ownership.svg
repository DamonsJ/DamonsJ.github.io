<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs><rect width="1400" height="700" fill="#FFFFFF"/><text x="40" y="46" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:25px;fill:#1E3A8A;font-weight:700">Ulysses 的核心一步：All-to-All 把「按 token 切」换成「按 head 切」</text><text x="40" y="72" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13px;fill:#6B7280">CP=2 · 24 heads · A2A 前后每个 rank 的数据量不变，变的是它拥有哪一块</text><text x="40" y="108" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:14.5px;fill:#334155;font-weight:700">把 [token, head] 看成一张二维所有权表，All-to-All 做的是「转置所有权」</text><rect x="40" y="145" width="440" height="290" rx="12" fill="#EAF8ED" fill-opacity="0.55" stroke="#57B26A" stroke-width="2"/><text x="54" y="171" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:16px;fill:#57B26A;font-weight:700">A2A 之前：按 token 切</text><text x="270" y="214" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#6B7280">heads 0…11</text><text x="410" y="214" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#6B7280">heads 12…23</text><text x="188" y="252" text-anchor="end" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:11.5px;fill:#6B7280">tokens</text><text x="188" y="268" text-anchor="end" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:11.5px;fill:#6B7280">0…13639</text><rect x="200" y="226" width="134" height="62" rx="4" fill="#EAF4FF" fill-opacity="1.0" stroke="#4A90E2" stroke-width="1.2"/><text x="267.0" y="254.0" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13px;fill:#4A90E2;font-weight:700">rank 0</text><text x="267.0" y="270.0" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:11.5px;fill:#6B7280">T0 x H0</text><rect x="340" y="226" width="134" height="62" rx="4" fill="#EAF4FF" fill-opacity="1.0" stroke="#4A90E2" stroke-width="1.2"/><text x="407.0" y="254.0" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13px;fill:#4A90E2;font-weight:700">rank 0</text><text x="407.0" y="270.0" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:11.5px;fill:#6B7280">T0 x H1</text><text x="188" y="320" text-anchor="end" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:11.5px;fill:#6B7280">tokens</text><text x="188" y="336" text-anchor="end" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:11.5px;fill:#6B7280">13640…27279</text><rect x="200" y="294" width="134" height="62" rx="4" fill="#EAF8ED" fill-opacity="1.0" stroke="#57B26A" stroke-width="1.2"/><text x="267.0" y="322.0" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13px;fill:#57B26A;font-weight:700">rank 1</text><text x="267.0" y="338.0" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:11.5px;fill:#6B7280">T1 x H0</text><rect x="340" y="294" width="134" height="62" rx="4" fill="#EAF8ED" fill-opacity="1.0" stroke="#57B26A" stroke-width="1.2"/><text x="407.0" y="322.0" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13px;fill:#57B26A;font-weight:700">rank 1</text><text x="407.0" y="338.0" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:11.5px;fill:#6B7280">T1 x H1</text><text x="340" y="388" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#6B7280">每 rank：半个序列 x 全部 24 heads</text><rect x="520" y="240" width="180" height="110" rx="10" fill="#FFE9EC" fill-opacity="1.0" stroke="#E11D48" stroke-width="2"/><text x="610" y="280" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:16px;fill:#E11D48;font-weight:700">All-to-All</text><text x="610" y="304" text-anchor="middle" style="font-family:'SF Mono',Menlo,Consolas,'Courier New',monospace;font-size:13px;fill:#334155">seq → head</text><text x="610" y="328" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:11.5px;fill:#6B7280">重分片，不复制</text><line x1="488" y1="295" x2="514" y2="295" stroke="#E11D48" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah)"/><line x1="705" y1="295" x2="731" y2="295" stroke="#E11D48" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah)"/><rect x="740" y="145" width="440" height="290" rx="12" fill="#EAF4FF" fill-opacity="0.55" stroke="#4A90E2" stroke-width="2"/><text x="754" y="171" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:16px;fill:#4A90E2;font-weight:700">A2A 之后：按 head 切</text><text x="970" y="214" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#6B7280">heads 0…11</text><text x="1110" y="214" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#6B7280">heads 12…23</text><text x="888" y="252" text-anchor="end" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:11.5px;fill:#6B7280">tokens</text><text x="888" y="268" text-anchor="end" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:11.5px;fill:#6B7280">0…13639</text><rect x="900" y="226" width="134" height="62" rx="4" fill="#EAF4FF" fill-opacity="1.0" stroke="#4A90E2" stroke-width="1.2"/><text x="967.0" y="254.0" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13px;fill:#4A90E2;font-weight:700">rank 0</text><text x="967.0" y="270.0" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:11.5px;fill:#6B7280">T0 x H0</text><rect x="1040" y="226" width="134" height="62" rx="4" fill="#EAF8ED" fill-opacity="1.0" stroke="#57B26A" stroke-width="1.2"/><text x="1107.0" y="254.0" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13px;fill:#57B26A;font-weight:700">rank 1</text><text x="1107.0" y="270.0" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:11.5px;fill:#6B7280">T0 x H1</text><text x="888" y="320" text-anchor="end" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:11.5px;fill:#6B7280">tokens</text><text x="888" y="336" text-anchor="end" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:11.5px;fill:#6B7280">13640…27279</text><rect x="900" y="294" width="134" height="62" rx="4" fill="#EAF4FF" fill-opacity="1.0" stroke="#4A90E2" stroke-width="1.2"/><text x="967.0" y="322.0" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13px;fill:#4A90E2;font-weight:700">rank 0</text><text x="967.0" y="338.0" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:11.5px;fill:#6B7280">T1 x H0</text><rect x="1040" y="294" width="134" height="62" rx="4" fill="#EAF8ED" fill-opacity="1.0" stroke="#57B26A" stroke-width="1.2"/><text x="1107.0" y="322.0" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13px;fill:#57B26A;font-weight:700">rank 1</text><text x="1107.0" y="338.0" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:11.5px;fill:#6B7280">T1 x H1</text><text x="1040" y="388" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#6B7280">每 rank：完整序列 x 一半 heads</text><rect x="1200" y="180" width="170" height="106" rx="8" fill="#FEF6E7" fill-opacity="1.0" stroke="#D97706" stroke-width="1.4"/><text x="1212" y="204" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#D97706;font-weight:700">转置</text><text x="1212" y="222" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">rank 0 收下</text><text x="1212" y="240" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">整整一列，</text><text x="1212" y="258" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">rank 1 收下</text><text x="1212" y="276" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">另一列。</text><rect x="40" y="460" width="1320" height="200" rx="12" fill="#F8FAFC" fill-opacity="0.55" stroke="#64748B" stroke-width="2"/><text x="54" y="486" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:16px;fill:#64748B;font-weight:700">为什么这样就对了</text><text x="70" y="508" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13.5px;fill:#334155;font-weight:700">Attention 的独立性有两个方向：</text><text x="70" y="536" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#334155">· head 之间互相独立 —— head i 的 softmax 只用 head i 的 Q/K/V；</text><text x="70" y="560" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#334155">· token 之间不独立 —— 每个 query token 必须看到全部 27280 个 key。</text><text x="70" y="594" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#0F766E;font-weight:700">所以「切 head」是安全的，「切 token」在 Attention 内部是不安全的。Ulysses 就是在进入 softmax 前把不安全的切法换成安全的，算完再换回来。</text><text x="70" y="626" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#6B7280">代价是两次 All-to-All；收益是整个 block 的其余部分都只处理 N/CP 个 token。</text></svg>