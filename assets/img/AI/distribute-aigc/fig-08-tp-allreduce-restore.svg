<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="720" viewBox="0 0 1340 720"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs><rect width="1340" height="720" fill="#FFFFFF"/><text x="40" y="46" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:25px;fill:#1E3A8A;font-weight:700">通信之后如何恢复：All-Reduce 把 partial 还原成与单卡等价的结果</text><text x="40" y="72" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13px;fill:#6B7280">TP=4 示意；Wan2.2 每个 WanBlock 触发 3 次，每条视频约 4500 次</text><text x="40" y="108" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:14.5px;fill:#334155;font-weight:700">把一个 [1, 27280, 3072] 的 residual 拆到 4 张卡上算，再原样拼回来</text><text x="60" y="150" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13.5px;fill:#334155;font-weight:700">① 切之前</text><rect x="60" y="162" width="200" height="120" rx="4" fill="#FFFFFF" fill-opacity="1.0" stroke="#475569" stroke-width="2"/><text x="160" y="228" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:18px;fill:#475569;font-weight:700">Y[m, n]</text><text x="160" y="300" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#6B7280">单卡：一次算完</text><line x1="270" y1="222" x2="320" y2="222" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah)"/><text x="340" y="150" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13.5px;fill:#334155;font-weight:700">② 每 rank 只算一部分被加项</text><rect x="340" y="162" width="96" height="120" rx="4" fill="#EAF4FF" fill-opacity="1.0" stroke="#4A90E2" stroke-width="1.6" stroke-dasharray="5 4"/><text x="388" y="214" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:17px;fill:#4A90E2;font-weight:700">Y0</text><text x="388" y="236" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:11px;fill:#6B7280">partial</text><text x="388" y="256" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:11px;fill:#6B7280">[m, n]</text><rect x="445" y="162" width="96" height="120" rx="4" fill="#EAF8ED" fill-opacity="1.0" stroke="#57B26A" stroke-width="1.6" stroke-dasharray="5 4"/><text x="493" y="214" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:17px;fill:#57B26A;font-weight:700">Y1</text><text x="493" y="236" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:11px;fill:#6B7280">partial</text><text x="493" y="256" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:11px;fill:#6B7280">[m, n]</text><rect x="550" y="162" width="96" height="120" rx="4" fill="#FFF2E3" fill-opacity="1.0" stroke="#F28C38" stroke-width="1.6" stroke-dasharray="5 4"/><text x="598" y="214" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:17px;fill:#F28C38;font-weight:700">Y2</text><text x="598" y="236" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:11px;fill:#6B7280">partial</text><text x="598" y="256" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:11px;fill:#6B7280">[m, n]</text><rect x="655" y="162" width="96" height="120" rx="4" fill="#F6EAFB" fill-opacity="1.0" stroke="#9A5AD6" stroke-width="1.6" stroke-dasharray="5 4"/><text x="703" y="214" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:17px;fill:#9A5AD6;font-weight:700">Y3</text><text x="703" y="236" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:11px;fill:#6B7280">partial</text><text x="703" y="256" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:11px;fill:#6B7280">[m, n]</text><text x="550" y="300" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#E11D48;font-weight:700">形状对，数值不对：每个都少加了 3/4 的项</text><line x1="770" y1="222" x2="820" y2="222" stroke="#E11D48" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah)"/><text x="840" y="150" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13.5px;fill:#E11D48;font-weight:700">③ All-Reduce SUM</text><rect x="840" y="162" width="200" height="120" rx="8" fill="#FFE9EC" fill-opacity="1.0" stroke="#E11D48" stroke-width="2"/><text x="940" y="206" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:14px;fill:#E11D48;font-weight:700">Σ 逐元素求和</text><text x="940" y="232" text-anchor="middle" style="font-family:'SF Mono',Menlo,Consolas,'Courier New',monospace;font-size:12.5px;fill:#334155">Y = Y0+Y1+Y2+Y3</text><text x="940" y="256" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:11.5px;fill:#6B7280">结果广播回每个 rank</text><line x1="1050" y1="222" x2="1090" y2="222" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah)"/><rect x="1095" y="162" width="200" height="120" rx="4" fill="#FFFFFF" fill-opacity="1.0" stroke="#0F766E" stroke-width="2"/><text x="1195" y="214" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:22px;fill:#0F766E;font-weight:700">Y</text><text x="1195" y="240" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:11.5px;fill:#6B7280">4 张卡逐比特一致</text><text x="1195" y="300" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#6B7280">④ 恢复到与单卡等价</text><rect x="40" y="340" width="620" height="290" rx="12" fill="#F8FAFC" fill-opacity="0.55" stroke="#64748B" stroke-width="2"/><text x="54" y="366" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:16px;fill:#64748B;font-weight:700">All-Reduce = Reduce-Scatter + All-Gather</text><text x="70" y="388" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#334155">NCCL 实际不会真的「先全部汇总再广播」，而是拆成两步：</text><rect x="70" y="412" width="270" height="72" rx="8" fill="#EAF8ED" fill-opacity="1.0" stroke="#57B26A" stroke-width="1.6"/><text x="82" y="433" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13.5px;fill:#57B26A;font-weight:700">Reduce-Scatter</text><text x="82" y="453" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">每个 rank 只对 1/4 的通道求和</text><text x="82" y="470" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">结束后 rank i 持有第 i 段的正确值</text><rect x="360" y="412" width="270" height="72" rx="8" fill="#FFF2E3" fill-opacity="1.0" stroke="#F28C38" stroke-width="1.6"/><text x="372" y="433" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:13.5px;fill:#F28C38;font-weight:700">All-Gather</text><text x="372" y="453" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">4 段正确值互相交换拼接</text><text x="372" y="470" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12px;fill:#334155">每个 rank 拿到完整 [m, n]</text><text x="70" y="540" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#334155">总链路流量 ≈ 2 x (p-1)/p x 张量大小，而不是 p 倍。</text><text x="70" y="564" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#334155">这也解释了 Sequence Parallel 的思路：既然中间本来就经过一次</text><text x="70" y="588" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#334155">「按维度切开」的状态，不如就停在那里别再 All-Gather 回去。</text><rect x="690" y="340" width="610" height="290" rx="12" fill="#FFE9EC" fill-opacity="0.55" stroke="#E11D48" stroke-width="2"/><text x="704" y="366" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:16px;fill:#E11D48;font-weight:700">Wan2.2 上这次通信有多贵（BF16）</text><text x="715" y="392" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#6B7280;font-weight:700">场景</text><text x="1010" y="392" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#6B7280;font-weight:700">逻辑张量</text><text x="1270" y="392" text-anchor="end" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#6B7280;font-weight:700">量级</text><line x1="710" y1="402" x2="1275" y2="402" stroke="#E2E8F0" stroke-width="1" stroke-linecap="round"/><text x="715" y="422" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#334155">TP All-Reduce，CP=1</text><text x="1010" y="422" text-anchor="start" style="font-family:'SF Mono',Menlo,Consolas,'Courier New',monospace;font-size:12px;fill:#6B7280">[1, 27280, 3072]</text><text x="1270" y="422" text-anchor="end" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#E11D48;font-weight:700">159.84 MiB</text><line x1="710" y1="436" x2="1275" y2="436" stroke="#E2E8F0" stroke-width="1" stroke-linecap="round"/><text x="715" y="456" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#334155">TP All-Reduce，CP=2</text><text x="1010" y="456" text-anchor="start" style="font-family:'SF Mono',Menlo,Consolas,'Courier New',monospace;font-size:12px;fill:#6B7280">[1, 13640, 3072]</text><text x="1270" y="456" text-anchor="end" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#E11D48;font-weight:700">79.92 MiB</text><line x1="710" y1="470" x2="1275" y2="470" stroke="#E2E8F0" stroke-width="1" stroke-linecap="round"/><text x="715" y="490" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#334155">每个 WanBlock</text><text x="1010" y="490" text-anchor="start" style="font-family:'SF Mono',Menlo,Consolas,'Courier New',monospace;font-size:12px;fill:#6B7280">self.o + cross.o + ffn_2</text><text x="1270" y="490" text-anchor="end" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#E11D48;font-weight:700">3 次</text><line x1="710" y1="504" x2="1275" y2="504" stroke="#E2E8F0" stroke-width="1" stroke-linecap="round"/><text x="715" y="524" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#334155">每条视频（30 层 x 50 步）</text><text x="1010" y="524" text-anchor="start" style="font-family:'SF Mono',Menlo,Consolas,'Courier New',monospace;font-size:12px;fill:#6B7280">3 x 30 x 50</text><text x="1270" y="524" text-anchor="end" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#E11D48;font-weight:700">4500 次</text><text x="715" y="600" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;font-size:12.5px;fill:#E11D48;font-weight:700">结论：TP 组必须放在同一台机器的 NVLink 域内。</text></svg>